function invErr(r){
  const e=apiErr(r);
  if(e.code==='otp_disabled'||/signups? not allowed/i.test(e.msg))return 'Invitationer kræver, at "Allow new users to sign up" er slået til i Supabase under Authentication → Sign In / Providers. Databasen afviser selv alle, der ikke er inviteret.';
  if(/database error/i.test(e.msg))return 'Databasen afviste brugeren. Kør SQL\'en under "Opsætning af databasen" igen i Supabase (spærringen for ikke-inviterede).';
  if(r.status===429||/rate limit|after \d+ seconds/i.test(e.msg))return 'Der er sendt for mange e-mails lige nu (Supabases grænse). Prøv igen om lidt.';
  if(/invalid.*e-?mail|e-?mail.*(invalid|format)/i.test(e.msg)||e.code==='validation_failed'||e.code==='email_address_invalid')return 'E-mailadressen er ikke gyldig.';
  if(r.status>=500||/smtp|sending|send.*mail/i.test(e.code+' '+e.msg))return 'Invitationen kunne ikke sendes. Tjek SMTP-opsætningen (Resend) i Supabase under Authentication → Emails.';
  return 'Databasen svarede ikke ('+r.status+').';
}
async function invSend(){
  const f=$('#main [data-in="inv-email"]');if(!f||inv.busy)return;if(!adminOnly('invitere nye brugere'))return;
  const mail=clean(f.value).toLowerCase();
  if(!mailOk(mail)){toast('Skriv en gyldig e-mailadresse.');f.focus();return;}
  if(!dbLoggedIn()){toast('Log ind i databasen først.');return;}
  /* 6.35: an invitation that has not been used yet can be sent again. */
  const ex=inv.list?inv.list.find(u=>u.email===mail):null;if(ex&&ex.last){toast(mail+' har allerede adgang.');return;}
  const g=db.gen;inv.busy=true;const b=$('#main [data-act="inv-send"]');if(b){b.setAttribute('aria-disabled','true');b.setAttribute('aria-busy','true');b.textContent='Sender…';}
  try{
    const r1=ex?{ok:true,status:200}:await dbFetch('/rest/v1/invites',{method:'POST',headers:{'Prefer':'return=minimal,resolution=merge-duplicates'},body:{email:mail}});
    if(g!==db.gen)return;
    if(!r1.ok){toast(r1.status===404||(r1.json&&/relation|schema cache/i.test(String(r1.json.message||'')))?'Tabellen invites findes ikke. Kør SQL\'en under "Opsætning af databasen" igen i Supabase.':r1.status===401?'Du er ikke logget ind.':r1.status===403?'Kun en administrator kan invitere nye brugere.':'Databasen svarede ikke ('+r1.status+').');return;}
    const r2=await dbFetch('/auth/v1/otp'+(appUrl()?'?redirect_to='+encodeURIComponent(appUrl()):''),{method:'POST',body:{email:mail,create_user:true},noAuth:true});
    if(g!==db.gen)return;
    if(!r2.ok){toast(invErr(r2));return;}
    state.log.unshift({d:today(),t:(ex?'Inviterede igen ':'Inviterede ')+mail+' til systemet',by:dbWho()});state.log=state.log.slice(0,40);markDirty();
    f.value='';toast('Invitationen er sendt'+(ex?' igen':'')+' til '+mail+'.');
    inv.at=0;await usersLoad(true);
  }catch(e){if(g===db.gen)toast(e.message||'Invitationen kunne ikke sendes.');}
  finally{if(g===db.gen){inv.busy=false;if(ui.tab==='opsaetning'&&!$('#dlg').open)render();}}
}
async function invRevoke(mail){

async function roleCall(fn,body,okMsg,what){
  if(inv.busy)return;const g=db.gen;inv.busy=true;
  try{const r=await dbFetch('/rest/v1/rpc/'+fn,{method:'POST',body});if(g!==db.gen)return;
    if(!r.ok){const e=apiErr(r);toast(r.status===404?'Funktionen '+fn+' findes ikke. Kør SQL\'en under "Opsætning af databasen" igen i Supabase.':/sidste administrator/i.test(e.msg)?'Der skal være mindst én administrator.':/ikke dig selv/i.test(e.msg)?'Du kan ikke fjerne dig selv.':/allerede en administrator/i.test(e.msg)?'Der er allerede en administrator. Bed vedkommende om at gøre dig til administrator.':/kun en administrator|ikke administrator/i.test(e.msg)?'Kun en administrator kan '+what+'.':'Det lykkedes ikke ('+r.status+').');return;}
    state.log.unshift({d:today(),t:okMsg,by:dbWho()});state.log=state.log.slice(0,40);markDirty();toast(okMsg+'.');inv.at=0;await usersLoad(true);
  }catch(e){if(g===db.gen)toast(e.message||'Det lykkedes ikke.');}
  finally{if(g===db.gen){inv.busy=false;if(ui.tab==='opsaetning'&&!$('#dlg').open)render();}}
}
async function roleClaim(){if(roleNow()!=='noadmin')return;if(!await ask('Gør dig selv til administrator? Så er det kun administratorer, der kan invitere og fjerne brugere, slette enheder, gendanne sikkerhedskopier, slette personer og rydde alle data.'))return;await roleCall('claim_admin',{},dbWho()+' blev administrator','blive administrator');}

/* ---------- Copy in a folder and operations check (version 6.31) ---------- */
/* Forslag 23 (Eddy 21-10-2026): a copy of the register outside Supabase. In Edge and Chrome on a pc a folder is chosen once (for example
   in OneDrive); while the tool is open and logged in, it writes enhedsoverblik-kopi-YYYY-MM-DD.json there once a day and keeps the 30
   newest. The folder handle lives in its own IndexedDB database on this pc. Browsers without folder access (phones, Firefox, Safari)
   get "Hent kopi nu" instead. "Gendan fra en kopi-fil" (administrators) loads such a file and saves it as a new version. */
const KOPI_KEY='enhedsoverblik.kopi',KOPI_RE=/^enhedsoverblik-kopi-\d{4}-\d\d-\d\d\.json$/;
const kopi={h:null,name:'',last:'',perm:'',busy:false,loaded:false,err:''};
let kopiDay='';
function kopiOk(){return typeof window.showDirectoryPicker==='function'&&window.isSecureContext!==false;}
function kidb(){return new Promise((res,rej)=>{const r=indexedDB.open('enhedsoverblik-kopi',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('h'))r.result.createObjectStore('h');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function kGet(){return kidb().then(d=>new Promise(res=>{const q=d.transaction('h','readonly').objectStore('h').get('dir');q.onsuccess=()=>{res(q.result||null);d.close();};q.onerror=()=>{res(null);d.close();};})).catch(()=>null);}
function kSet(v){return kidb().then(d=>new Promise(res=>{const tx=d.transaction('h','readwrite'),st=tx.objectStore('h');if(v)st.put(v,'dir');else st.delete('dir');tx.oncomplete=()=>{res(true);d.close();};tx.onerror=()=>{res(false);d.close();};})).catch(()=>false);}
async function kopiLoad(){
  if(kopi.loaded)return;kopi.loaded=true;const l=lsGet(KOPI_KEY);kopi.last=typeof l==='string'&&isDay(l)?l:'';
  if(!kopiOk())return;const h=await kGet();
  if(h&&h.kind==='directory'){kopi.h=h;kopi.name=String(h.name||'').slice(0,120);try{kopi.perm=await h.queryPermission({mode:'readwrite'});}catch(e){kopi.perm='denied';}}
}
function kopiName(){return 'enhedsoverblik-kopi-'+today()+'.json';}
async function kopiWrite(manual){
  if(!kopi.h||kopi.busy||state.demo||!dbLoggedIn()||!db.loaded)return false;
  kopi.busy=true;kopi.err='';
  try{
    let p=await kopi.h.queryPermission({mode:'readwrite'});
    if(p!=='granted'&&manual)p=await kopi.h.requestPermission({mode:'readwrite'});
    kopi.perm=p;if(p!=='granted')return false;
    const fh=await kopi.h.getFileHandle(kopiName(),{create:true}),w=await fh.createWritable();
    await w.write(JSON.stringify(stateForSave()));await w.close();
    const names=[];for await (const [n,e] of kopi.h.entries()){if(e.kind==='file'&&KOPI_RE.test(n))names.push(n);}
    names.sort().reverse().slice(30).forEach(n=>{kopi.h.removeEntry(n).catch(()=>{});});
    kopi.last=today();lsSet(KOPI_KEY,kopi.last);return true;
  }catch(e){kopi.err='Kopien kunne ikke gemmes i mappen'+(e&&e.name==='NotFoundError'?' (mappen findes ikke mere; vælg den igen)':'')+'.';return false;}
  finally{kopi.busy=false;}
}
async function kopiAuto(){await kopiLoad();if(kopi.h&&kopi.last!==today()&&dbLoggedIn()&&db.loaded&&!state.demo){if(await kopiWrite(false)&&ui.tab==='opsaetning'&&!$('#dlg').open)render();}}

}

}
/* Forslag 22: Driftstjek. One look at whether the database, the copies and the users are in order. The checks run in the tool when it
   is open (no e-mail: forslag 7 was not chosen). What needs action also shows on the Dashboard for administrators. */
function driftItems(){
  if(!dbLoggedIn())return [];
  const out=[],day=864e5,ago=d=>d?Math.floor((Date.now()-new Date(d).getTime())/day):null;
  const bad=db.state==='conflict'||db.state==='unreadable'||db.state==='error';
  const dbs=bad?'bad':db.state==='ok'||db.state==='saving'?'ok':'warn';out.push({s:dbs,t:'Databasen: '+(dbStatusText()||(bad?'kræver opmærksomhed':'forbundet'))});
  if(!db.obOk)out.push({s:'bad',t:'Ændringer er hverken nået frem til databasen eller gemt på pc\'en. Hold siden åben, til forbindelsen er tilbage.'});
  const sn=(snapList||[])[0];if(snapList)out.push(sn&&ago(sn.at)<=7?{s:'ok',t:'Sikkerhedskopi på denne pc: '+fmtDateTime(sn.at)}:{s:'warn',t:'Ingen sikkerhedskopi på denne pc fra de seneste 7 dage. Den kommer af sig selv ved næste gem.'});
  if(kopi.loaded){if(kopi.h)out.push(kopi.last&&ago(kopi.last)<=2?{s:'ok',t:'Kopi i mappen '+kopi.name+': '+fmtDate(kopi.last)}:{s:'warn',t:'Kopien i mappen '+kopi.name+' er '+(kopi.last?ago(kopi.last)+' dage gammel':'ikke taget endnu')+'. Tryk Tag kopi nu.'});
    else out.push(kopi.last&&ago(kopi.last)<=30?{s:'ok',t:'Seneste hentede kopi: '+fmtDate(kopi.last)}:{s:'warn',t:'Ingen kopi uden for databasen'+(kopi.last?' de seneste 30 dage':'')+'. '+(kopiOk()?'Vælg en mappe under Kopi uden for databasen.':'Tryk Hent kopi nu.')});}
  if(sqlv.n>=0)out.push(sqlv.n>=DB_SQL_NEED?{s:'ok',t:'Databasens opsætning (SQL) er fra version '+(sqlv.n>=100?(sqlv.n/100).toFixed(2).replace('.',',').replace(/0$/,''):sqlv.n)+' eller nyere'}:{s:'bad',t:'Databasens opsætning (SQL) er ældre end 6.35. Kør SQL\'en igen under Opsætning af databasen.'});
  const r=roleNow();
  if(r==='legacy')out.push({s:'warn',t:'Roller kræver den nye opsætning af databasen (6.31). Kør SQL\'en igen.'});
  else if(r==='noadmin')out.push({s:'warn',t:'Ingen er administrator. Tryk Gør mig til administrator under Brugere.'});
  else if(inv.roles)out.push({s:'ok',t:pl(inv.roles.filter(x=>x.role==='admin').length,'administrator','administratorer')});
  if(inv.list){const old=inv.list.filter(u=>u.last&&ago(u.last)>90),inv7=inv.list.filter(u=>!u.last&&(inv.invites||[]).some(x=>x.email===u.email&&ago(x.at)>7));
    if(old.length)out.push({s:'warn',t:pl(old.length,'bruger har','brugere har')+' ikke logget ind i 90 dage. Fjern adgangen, hvis de er stoppet.'});
    if(inv7.length)out.push({s:'warn',t:pl(inv7.length,'invitation','invitationer')+' er ikke brugt efter 7 dage. Send igen (skriv e-mailen under Ny brugers e-mail), eller træk tilbage.'});
    if(!old.length&&!inv7.length)out.push({s:'ok',t:'Brugerne: '+pl(inv.list.length,'bruger','brugere')+', alle aktive'});}
  return out;
}

/* ---------- SIM cards (version 5.3) ---------- */
/* A SIM card is its own record: it normally stays in the phone and follows
   it to the next user; when a device goes to repair or back to the Supporten
   the card is taken out and kept in stock (Eddy, 09-10-2026). The phone
   number is the card's identity until its ICCID has been scanned in. */
const SIM_ST=['i enhed','på lager','returneret','bortkommet'];
const SIM_WORD={'i enhed':'I enhed','på lager':'På lager','returneret':'Sendt retur','bortkommet':'Bortkommet'};
function simDigits(v){return String(v==null?'':v).replace(/\D/g,'');}
function simPhoneKey(v){let d=simDigits(v);if(d.startsWith('0045')&&d.length===12)d=d.slice(4);else if(d.startsWith('45')&&d.length===10)d=d.slice(2);return d;}
function simIccidOk(v){return /^\d{18,20}$/.test(simDigits(v));}
function simById(id){return state.sims.find(s=>s.id===id);}
function simsOf(d){return state.sims.filter(s=>s.status==='i enhed'&&s.devId===d.id);}
function simFree(){return state.sims.filter(s=>s.status==='på lager').sort((a,b)=>(a.since||'9').localeCompare(b.since||'9')||(a.phone||'~').localeCompare(b.phone||'~'));}
function simLabel(s){return esc(s.phone||(s.iccid?'…'+s.iccid.slice(-6):'Uden nummer'));}
/* Version 6.6 (Eddy 18-10-2026): "hvor man ser en enhed med simkort i, så skal man kunne se telefonnummeret … og trykke på det, så det åbner detaljer":
   the number of every card in the device as a link that opens the card (Register, Lager, scan results, Inaktive, digital lists). */
function simLinks(d){const ls=simsOf(d);if(!ls.length)return '';return ls.map(s=>'<button class="linkish simlnk num" data-act="sim-edit" data-arg="'+s.id+'" aria-label="Simkort '+simLabel(s)+', vis detaljer">'+(s.phone?'Tlf. ':'Simkort ')+simLabel(s)+'</button>').join(' · ');}
/* An ICCID held only by a returned or lost card: the physical card has been found again. */
async function simReclaimAsk(iccid,to){
  const old=state.sims.find(x=>x!==to&&x.iccid===iccid&&(x.status==='returneret'||x.status==='bortkommet'));
  if(!old)return false;
  return (await ask('Kortet med dette ICCID er registreret som '+(old.status==='bortkommet'?'bortkommet':'sendt retur til Supporten')+'. Har du kortet i hånden igen? Så flyttes ICCID\'et over på det kort, du gemmer nu.'))?old:null;
}
function simReclaimDo(old,to){simHist(old,'Kortet er fundet igen. ICCID flyttet til '+(to&&to.phone?'kortet '+to.phone:'et kort uden nummer'));old.iccid='';}
async function simReclaim(iccid,to){const old=await simReclaimAsk(iccid,to);if(old)simReclaimDo(old,to);return old===null?null:!!old;}
function simHist(s,t){s.history.push({d:today(),t:t});if(s.history.length>60)s.history=s.history.slice(-60);}
function simNew(o){const s={id:'s'+uid(),iccid:simDigits(o.iccid||''),phone:simPhoneKey(o.phone||''),status:SIM_ST.includes(o.status)?o.status:'på lager',devId:o.devId||'',since:today(),note:'',slot:'',history:[]};state.sims.push(s);return s;}
function simStock(s,why){
  const d=s.devId?devById(s.devId):null;
  s.status='på lager';s.devId='';s.since=today();s.slot=slotNext(s);
  simHist(s,(d?'Taget ud af '+(d.label||d.serial||'enheden')+'. ':'')+why+'. Lagt i kartoteket, '+slotTxt(s));slotNote(s,'ind');
  if(d&&d.phone&&simPhoneKey(d.phone)===s.phone&&!simsOf(d).length)d.phone='';
}
function simInto(s,d,why){
  const was=s.devId?devById(s.devId):null;
  if(was&&was!==d&&was.phone&&simPhoneKey(was.phone)===s.phone)was.phone='';
  const slot=s.status==='på lager'?s.slot:'';
  s.status='i enhed';s.devId=d.id;s.since=today();s.slot='';
  if(!d.phone||!simsOf(d).some(x=>x!==s&&simPhoneKey(d.phone)===x.phone))d.phone=s.phone;
  simHist(s,(slot?'Taget fra lomme '+slot+'. ':'')+'Sat i '+(d.label||d.serial||'enheden')+(why?'. '+why:''));if(slot)slotNote(Object.assign({},s,{slot}),'ud');
}
function simEnd(s,status,why){
  const d=s.devId?devById(s.devId):null,slot=s.status==='på lager'?s.slot:'';
  s.status=status;s.devId='';s.since=today();s.slot='';
  simHist(s,(slot?'Taget fra lomme '+slot+'. ':'')+SIM_WORD[status]+(d?' sammen med '+(d.label||d.serial||'enheden'):'')+(why?'. '+why:''));if(slot)slotNote(Object.assign({},s,{slot}),'ud');
  if(d&&d.phone&&simPhoneKey(d.phone)===s.phone)d.phone='';
}
/* Dual-SIM models (…/DS) take two cards, others one. */
function simSlots(d){return /\/DS\b/i.test(d.model||'')?2:1;}
function simCanTake(d){return ACTIVE.has(d.status)&&simsOf(d).length<simSlots(d);}
/* A card named in plain text: its number, or the end of its ICCID. */
function simTxt(s){return s.phone||(s.iccid?'…'+s.iccid.slice(-6):'uden nummer');}
/* Version 6.23 (Eddy 20-10-2026): the SIM stock is a Rolodex Rotary: every plastic pocket has a label (A1, A2, … then B1 …; pockets per letter is set
   under Opsætning → Lager, default 10). A card that goes into the stock gets the lowest free pocket (s.slot) and a box says where to put it; a card that
   leaves the stock (into a device, sent back, lost) frees the pocket, and a box says which pocket to take it from. Cards on stock without a pocket
   (from before 6.23) are a task on Dashboard and can be given pockets one by one (Ret) or all at once (Giv alle en lomme). */
function slotPerLetter(){const n=parseInt(state.stock.simPerLetter,10);return n>=1&&n<=99?n:10;}
function slotNorm(v){const m=/^([A-Za-z])\s*0*(\d{1,3})$/.exec(String(v||'').trim());return m&&+m[2]>0?m[1].toUpperCase()+(+m[2]):'';}
function slotKey(v){const m=/^([A-Z])(\d+)$/.exec(v||'');return m?(m[1].charCodeAt(0)-65)*1000+(+m[2]):1e9;}
function slotUsed(not){const u=new Set();state.sims.forEach(x=>{if(x!==not&&x.status==='på lager'&&x.slot)u.add(x.slot);});return u;}
function slotNext(not){const u=slotUsed(not),n=slotPerLetter();for(let L=0;L<26;L++)for(let i=1;i<=n;i++){const k=String.fromCharCode(65+L)+i;if(!u.has(k))return k;}return '';}
function slotTxt(x){return x.slot?'lomme '+x.slot:'uden lomme';}
/* Version 6.31 (forslag 14): the Rolodex as a small grid, one row per letter (A to the highest letter in use), each pocket either
   taken (the card's number, a button that opens the card) or free. Shows at a glance how full the Rolodex is. */
function slotGridHtml(){
  const n0=slotPerLetter(),by=new Map();state.sims.forEach(x=>{if(x.status==='på lager'&&x.slot)by.set(x.slot,x);});
  /* 6.35: an occupied pocket above the setting (after it was lowered) is still drawn and counted, after the others in its row. */
  let maxL=0;const n=n0;by.forEach((x,k)=>{maxL=Math.max(maxL,k.charCodeAt(0)-65);});let extra=0;
  const rows=[],letters=maxL+1;let taken=0;
  for(let L=0;L<letters;L++){const ch=String.fromCharCode(65+L);let cells='';
    for(let i=1;i<=n;i++){const k=ch+i,x=by.get(k);if(x)taken++;
      cells+=x?'<button class="slotc on" data-act="slot-open" data-arg="'+x.id+'" title="'+esc(k+': '+simTxt(x))+'" aria-label="Lomme '+k+': simkort '+esc(simTxt(x))+'">'+k+'</button>':'<span class="slotc" aria-label="Lomme '+k+': ledig">'+k+'</span>';}
    [...by.keys()].filter(k=>k[0]===ch&&+k.slice(1)>n).sort((a,b)=>+a.slice(1)-+b.slice(1)).forEach(k=>{const x=by.get(k);taken++;extra++;cells+='<button class="slotc on" data-act="slot-open" data-arg="'+x.id+'" title="'+esc(k+': '+simTxt(x))+'" aria-label="Lomme '+k+': simkort '+esc(simTxt(x))+'">'+k+'</button>';});
    rows.push('<div class="slotrow">'+cells+'</div>');}
  const total=letters*n+extra,free=total-taken,next=slotNext();
  return '<details class="group slotgrid"'+(ui.slotGridOpen?' open':'')+'><summary><h2>Kartoteket</h2><span class="muted num">'+taken+' af '+total+' lommer optaget (A'+(letters>1?'–'+String.fromCharCode(64+letters):'')+')'+(next?' · næste ledige: '+next:'')+'</span>'+ICON.chev+'</summary>'+
    '<div class="slotwrap">'+rows.join('')+'</div><p class="muted" style="font-size:.8125rem;margin:.4rem .2rem 0">Orange = optaget (tryk for at se kortet), grå = ledig. '+(free?pl(free,'ledig lomme','ledige lommer')+' i de bogstaver, der er i brug.':'Alle lommer er optaget; næste kort får '+(next||'en ny lomme')+'.')+'</p></details>';
}
function simNoSlot(){return state.sims.filter(x=>x.status==='på lager'&&!x.slot);}
let slotPend=[],slotTimer=null,slotSilent=0;
function slotNote(x,dir){if(slotSilent)return;slotPend.push({id:x.id,dir,slot:x.slot,phone:x.phone,iccid:x.iccid});if(!slotTimer)slotTimer=setTimeout(()=>{slotTimer=null;slotShow();},0);}

/* The full list names a phone number on each device: that is the card in it. */
function simEnsure(d,phone,src){
  const k=simPhoneKey(phone);if(!/^\d{8}$/.test(k)||!ACTIVE.has(d.status))return;
  const from=src==='manual'?'feltet Telefonnummer':'listen';
  let s=state.sims.find(x=>x.phone===k&&(x.status==='i enhed'||x.status==='på lager'))||state.sims.find(x=>x.phone===k);
  if(s&&s.status==='i enhed'&&s.devId===d.id)return;
  /* A card in this device that was scanned without a number: this is its number,
     also when an old returned or lost card had it before (the old card keeps it only in its history). */
  if(s&&(s.status==='returneret'||s.status==='bortkommet')){simHist(s,'Nummeret '+k+' er flyttet til et nyt kort');s.phone='';s=null;}
  if(!s){const blank=simsOf(d).find(x=>!x.phone);if(blank){blank.phone=k;simHist(blank,'Nummeret '+k+' er sat på kortet fra '+from);if(!d.phone)d.phone=k;return;}}
  /* A card that sits in a device in use is not moved to a device in stock. */
  if(s&&s.status==='i enhed'&&s.devId!==d.id){const o=devById(s.devId);if(o&&ACTIVE.has(o.status)&&!inStock(o)&&inStock(d))return;}
  /* A card the list itself put in this device, with another number: the number changed, so that card is out. */
  simsOf(d).filter(x=>x!==s&&!x.iccid&&x.history.length&&/^(Oprettet fra listen|Sat i .*listen)/.test(x.history[x.history.length-1].t)).forEach(x=>simStock(x,'Listen viser nu et andet nummer på enheden'));
  if(src==='manual')simsOf(d).filter(x=>x!==s&&!x.iccid&&x.history.length===1&&/^Oprettet fra feltet Telefonnummer/.test(x.history[0].t)).forEach(x=>{state.sims=state.sims.filter(y=>y!==x);});
  /* A one-slot device whose list shows another number: the card in it is not the one in use, so it goes to stock. */
  if(simSlots(d)===1)simsOf(d).filter(x=>x!==s).forEach(x=>simStock(x,(src==='manual'?'Feltet Telefonnummer':'Listen')+' viser et andet nummer på enheden, som kun har plads til ét kort. Tjek kortet'));
  if(!s&&simsOf(d).length>=simSlots(d))return;
  if(!s){s=simNew({phone:k,status:'i enhed',devId:d.id});simHist(s,'Oprettet fra '+from+'. Sidder i '+(d.label||d.serial||'enheden'));return;}
  if(simsOf(d).length>=simSlots(d))return;
  simInto(s,d,s.status==='på lager'?'Nummeret står på '+from+' under enheden, så kortet er ikke på lager':s.status==='i enhed'?'Nummeret står på '+from+' under denne enhed':'Nummeret er i brug igen ifølge '+from);
}

function simOnStatus(d,v){
  const ls=simsOf(d);if(!ls.length)return '';
  if(v==='Skal sendes retur'){ls.forEach(x=>{if(!simWait.includes(x.id))simWait.push(x.id);});setTimeout(simWaitOpen,0);return '';}
  if(v==='Sendt retur'){ls.forEach(s=>simStock(s,'Enheden sendes retur til Supporten'));return ' Tag '+(ls.length===1?'simkortet '+simTxt(ls[0]):ls.length+' simkort')+' ud, og læg '+(ls.length===1?'det i '+slotTxt(ls[0]):'dem i kartoteket (se boksen)')+'. Det står nu som på lager.';}
  if(v==='Bortkommet'){ls.forEach(s=>simEnd(s,'bortkommet',''));return ' '+(ls.length===1?'Simkortet '+simTxt(ls[0])+' er':ls.length+' simkort er')+' meldt bortkommet.';}
  return '';
}
function simFind(q){
  const k=simDigits(q),txt=norm(q);
  if(k.length>=4&&k.length>=txt.replace(/\s/g,'').length-1){
    const pk=simPhoneKey(q);
    const exact=state.sims.filter(s=>s.phone===pk||(s.iccid&&s.iccid===k));
    if(exact.length)return exact;
    return state.sims.filter(s=>s.phone.endsWith(k)||(s.iccid&&s.iccid.endsWith(k))||s.phone.startsWith(k)).slice(0,8);
  }
  if(txt.length<2)return [];
  /* Text: the user or the label of the device the card sits in. */
  return state.sims.filter(s=>{if(s.status!=='i enhed'||!s.devId)return false;const d=devById(s.devId);return !!d&&(norm(d.label).includes(txt)||norm(d.lastUser).includes(txt)||norm(d.serial).includes(txt));}).slice(0,12);
}

async function doSimNew(){
  const iccid=simDigits($('#simIccid').value),phone=simPhoneKey($('#simPhone').value),devId=$('#simDev').value;
  if(iccid&&!simIccidOk(iccid)){toast('ICCID har 18 til 20 cifre.');$('#simIccid').focus();return;}
  /* Version 5.67 (Eddy 12-10-2026): a card cannot be saved without its phone number. */
  if(!phone){toast('Skriv telefonnummeret. Et simkort kan ikke gemmes uden.');$('#simPhone').focus();return;}
  if(phone&&!/^\d{8}$/.test(phone)){toast('Telefonnummeret har 8 cifre.');$('#simPhone').focus();return;}
  const rc=iccid?await simReclaimAsk(iccid,null):false;if(rc===null)return;
  if(iccid&&state.sims.some(s=>s!==rc&&s.iccid===iccid&&!(phone&&s.phone===phone))){toast('Kortet med det ICCID findes allerede.');return;}
  const live=s=>s.status==='i enhed'||s.status==='på lager';
  const dup=state.sims.find(s=>s!==rc&&((iccid&&s.iccid===iccid)||(phone&&s.phone===phone&&live(s))));
  const old=phone&&!dup?state.sims.find(s=>s.phone===phone&&!live(s)):null;
  if(dup){if(iccid&&!dup.iccid&&dup.phone===phone){if(rc)simReclaimDo(rc,dup);dup.iccid=iccid;simHist(dup,'ICCID tilføjet');const dd=devId?devById(devId):null;let put=false;if(dd&&dup.status==='på lager'&&simCanTake(dd)){simInto(dup,dd,'');put=true;}markDirty();$('#dlg').close();toast('Kortet fandtes allerede med nummeret. ICCID er sat på.'+(put?' Det er sat i '+(dd.label||'enheden')+'.':dd?' Enheden er ikke ændret, fordi kortet ikke ligger på lager, eller enheden ikke kan tage et kort.':''));return;}toast('Kortet findes allerede: '+(dup.phone||dup.iccid)+'.');return;}
  const d=devId?devById(devId):null;if(d&&!simCanTake(d)){toast('Enheden kan ikke tage et kort nu.');return;}
  if(old){simHist(old,'Nummeret '+phone+' er flyttet til et nyt kort');old.phone='';}
  if(rc)simReclaimDo(rc,{phone});
  /* Version 6.23: a new card that goes on stock gets a pocket in the Rolodex at once, and the box says which. */
  const s=simNew({iccid,phone,status:'på lager'});if(d){simHist(s,'Oprettet');simInto(s,d,'');}else{s.slot=slotNext(s);simHist(s,'Oprettet. Lagt i kartoteket, '+slotTxt(s));slotNote(s,'ind');}
  markDirty();$('#dlg').close();ui.simq='';toast(d?'Kortet er oprettet og sat i '+(d.label||'enheden')+'.':'Kortet er oprettet og ligger på lager i '+slotTxt(s)+'.');
}

  const pick=a=>a[Math.floor(rnd()*a.length)];
  const fn=['Anne','Bo','Camilla','Dennis','Emma','Frederik','Gitte','Hanne','Ida','Jakob','Karin','Lars','Mette','Niels','Oda','Peter','Rikke','Søren','Tina','Ulla'];
  const ln=['Andersen','Bak','Dahl','Eriksen','Friis','Holm','Iversen','Juhl','Krogh','Lund','Madsen','Nygaard','Olsen','Poulsen','Ravn','Skov','Thomsen','Vestergaard'];
  const chars='ABCDEFGHJKLMNPQRSTVWXYZ0123456789';
  const str=(n,set)=>{let s='';for(let i=0;i<n;i++)s+=set[Math.floor(rnd()*set.length)];return s;};
  const dago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(6+Math.floor(rnd()*12))+':'+pad(Math.floor(rnd()*60));};
  state=freshState();state.demo=true;state.site='Eksempelhuset';
  const depts=allDepts();const leaders=depts.map(()=>pick(fn)+' '+pick(ln));
  demoLeaders=new Set(leaders);touched.site=touched.floors=touched.leavers=touched.stock=false;
  state.floors.forEach(f=>f.depts.forEach(d=>{d.leader=leaders[depts.findIndex(x=>x.id===d.id)];}));
  const recs=[];
  for(let i=0;i<70;i++){
    const tab=i>=50;
    recs.push({serial:(tab?'R52T':'R5CT')+str(7,chars),imei:withLuhn('35'+str(12,'0123456789')),model:tab?'SM-T636B':'SM-G736B/DS',type:'',phone:String(2+Math.floor(rnd()*4))+str(7,'0123456789'),user:pick(fn)+' '+pick(ln),seen:dago(Math.floor(rnd()*18))});
  }
  const cats=[[90,3,[96,104,117]],[60,6,[62,66,69,71,75,84]],[30,8,[33,35,38,40,42,44,47,55]]];
  let ix=4;const tables=[];
  cats.forEach(c=>{const t={cat:c[0],recs:[]};c[2].forEach(days=>{const r=recs[ix];ix+=4;r.seen=dago(days);t.recs.push(Object.assign({},r,{retur:false,laasop:false,plan:''}));});tables.push(t);});
  tables[1].recs[0].user='';

  applyFull(recs);
  state.devices.forEach((d,i)=>{if(i%9!==5)d.deptId=depts[(i*7+Math.floor(i/4))%depts.length].id;});
  applyInactive(tables,false);
  const pv={};state.inactive.rows.forEach((r,i)=>{if(r.cat===60&&i%2)pv[r.id]=30;else if(i%3)pv[r.id]=r.cat;});
  state.inactive.prev=pv;
  state.leavers=tables[0].recs[0].user+'\n'+tables[1].recs[2].user;demoLeavers=new Set(state.leavers.split('\n').map(l=>l.trim()));
  /* Three devices in stock: two phones ready, one tablet waiting to be reset. */
  const dd=n=>dago(n).slice(0,10);
  [[5,'Reserve',12,10],[14,'Reserve',44,41],[68,'Afventer nulstilling',2,0]].forEach(([i,st,a,b])=>{const d=state.devices[i];d.deptId=LAGER;d.status=st;d.stockSince=dd(a);d.readySince=st==='Reserve'?dd(b):'';});
  assignLabels();
  state.devices.forEach(d=>{d.history=d.history.slice(0,2);});
  [7,21].forEach(i=>{const d=state.devices[i];if(!inStock(d))setShared(d,true);});
  state.sims.forEach((s,i)=>{if(i%3===0)s.iccid='8945'+String(100000000000000+Math.floor(rnd()*899999999999999));s.history=s.history.slice(0,1);s.since=dd(30+Math.floor(rnd()*300));if(s.history[0])s.history[0].d=s.since;});
  [[11,'Enheden sendes retur til Supporten'],[23,'Enheden sendes retur til Supporten']].forEach(([i,why])=>{const d=state.devices[i];if(d&&ACTIVE.has(d.status))simsOf(d).forEach(s=>{simStock(s,why);s.since=dd(9);});});
  state.sims.filter(s=>s.status==='på lager').forEach((s,i)=>{if(i===0){s.since=dd(40);s.iccid=s.iccid||'8945'+String(100000000000000+Math.floor(rnd()*899999999999999));}});
  const simR=state.sims.find(s=>s.status==='på lager'&&s.iccid);if(simR){simEnd(simR,'returneret','Sendt retur sammen med en lukket enhed');simR.since=dd(20);}
  [[9,-6],[31,3]].forEach(([i,n])=>{const d=state.devices[i];if(!inStock(d)&&!d.shared&&ACTIVE.has(d.status)){d.leaveDate=dd(n);d.history.push({d:dd(Math.max(n,0)+4),t:'Forventet retur: brugeren stopper den '+fmtDate(d.leaveDate)});}});
  const ev=(d,day,text,e)=>d.history.push({d:dd(day),t:text,e:e});
  [[5,12,10],[14,44,41],[68,2,null]].forEach(([i,a,r])=>{const d=state.devices[i];forgetDevice(d);ev(d,a,'Indleveret til lager fra Uden placering. Simkort: ja',{k:'Indleveret',who:'',place:'Uden placering'});if(r!=null)ev(d,r,'Klar på lager. Nulstillet',{k:'Klar',who:'',place:'Lager'});});
  {const d=state.devices[0],nw=pick(fn)+' '+pick(ln),pn=placeName(d.deptId);forgetDevice(d);ev(d,20,'Indleveret til lager fra '+pn+'. Simkort: ja',{k:'Indleveret',who:'',place:pn});ev(d,18,'Klar på lager. Nulstillet',{k:'Klar',who:'',place:'Lager'});ev(d,9,'Udleveret til '+nw+', '+pn+'. Opdateret: ja, testet: ja',{k:'Udleveret',who:nw,place:pn});d.lastUser=nw;d.userBy={};d.lockUser=dd(9);}
  state.devices.forEach(d=>d.history.sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0));
  state.sims.filter(x=>x.status==='på lager').sort((a,b)=>(a.since||'').localeCompare(b.since||'')).forEach(x=>{x.slot=slotNext(x);});
  dirty=false;resetUi();render();
}

   The test suite sets window.__nativeConfirm, so Playwright's dialog handlers keep working there. */
function askSplit(msg){const ps=String(msg).split(/\n\s*\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);if(!ps.length)return ['Er du sikker?',[]];
  const m=ps[0],i=m.search(/[.?!](\s|$)/);if(i>0&&i<110&&(i+1<m.length||ps.length>1)){const rest=m.slice(i+1).trim();return [m.slice(0,i+1),(rest?[rest]:[]).concat(ps.slice(1))];}
  if(ps.length>1)return [m,ps.slice(1)];return ['Er du sikker?',ps];}
function ask(msg,o){o=o||{};if(window.__nativeConfirm)return Promise.resolve(confirm(msg));
  return new Promise(res=>{const [t,ps]=o.title?[o.title,String(msg).split(/\n\s*\n/).filter(Boolean)]:askSplit(msg);const d=$('#askDlg');
    d.innerHTML='<form method="dialog" class="askf"><h2 id="askT">'+esc(t)+'</h2>'+ps.map(x=>'<p>'+esc(x)+'</p>').join('')+'<div class="row-actions dlg-actions"><button type="submit" class="btn" value="no">'+esc(o.cancel||'Annullér')+'</button><button type="submit" class="btn '+(o.danger?'danger':'primary')+'" value="ok" autofocus>'+esc(o.ok||'OK')+'</button></div></form>';
    const done=()=>{d.removeEventListener('close',done);res(d.returnValue==='ok');};d.addEventListener('close',done);d.returnValue='';d.showModal();});}

   only the login's own actions run; every other action (tabs, search, Akademi, example data, dialogs with content) is ignored, and render() keeps
   the login page. Opsætning is reached only after login. */
const LOGIN_ACTS=new Set(['db-otp-send','db-otp-verify','db-otp-resend','db-otp-change','db-logout','dlg-close']);
function gateBlocks(act){return loginGate()&&!LOGIN_ACTS.has(act);}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(gateBlocks(b.dataset.act))return;
  if(b.dataset.act!=='reg-more')regUnpin();
  const fn=ACT[b.dataset.act];if(fn)fn(b.dataset.arg);
});

}

  else if(ch==='ready-cb'||ch==='ready-all'||ch==='hi-cb'||ch==='hi-all'){const hi=ch.startsWith('hi');const cbs=[...document.querySelectorAll('#dlg [data-ch="'+(hi?'hi-cb':'ready-cb')+'"]')];if(ch==='ready-all'||ch==='hi-all')cbs.forEach(c=>{c.checked=el.checked;});const all=cbs.every(c=>c.checked);const m=$('#dlg [data-ch="'+(hi?'hi-all':'ready-all')+'"]');if(m)m.checked=all;const b=$('#dlg [data-act="'+(hi?'hand-in':'ready')+'"]');if(b){b.disabled=!all;if(all&&(ch==='ready-all'||ch==='hi-all'||hi))b.focus();}}  /* 6.12: Indlevér has one check, so the tick itself moves focus to the button (Enter hands in) */
  else if(ch==='tjek-here'){const c=tjekData('optaelling');c.here=validPlaces().has(el.value)&&el.value!==LAGER?el.value:'';markDirty();toast(c.here?'Scanning spørger nu, om en enhed, der står et andet sted, skal flyttes til '+placeName(c.here)+'.':'Scanning sætter kun kryds.');const f=$('#main [data-in="tjek-scan"]');if(f&&!matchMedia('(pointer:coarse)').matches)f.focus();}

  /* Version 5.68 (Eddy 12-10-2026): the type can be set in the register, also for many at once. */

      ds.forEach(d=>{if(d.type!=='Telefon'){d.type='Telefon';hist(d,'Type: Telefon');relabelNew(d);n++;}if(!d.shared){setShared(d,true);n++;}});}
    else ds.forEach(d=>{if(d.shared&&v==='Telefon'){setShared(d,false);n++;}if(d.type!==v){d.type=v;hist(d,'Type: '+v);relabelNew(d);n++;}});

document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in,id=el.dataset.id;if(!k||k==='dev-leave'||/^db-/.test(k))return;

  if(k==='scan'||k==='qs'||k==='tjek-scan'){const now=performance.now(),n=el.value.length;if(!n||!fast.t0||now-fast.last>300||n-fast.len>1||n<fast.len){fast.t0=now;fast.ev=1;}else fast.ev++;fast.last=now;fast.len=n;}

document.addEventListener('paste',e=>{

/* A hand scanner types a whole code within a fraction of a second. Tab after
   such a burst is treated as the end of a scan; Tab after normal typing moves on. */
const fast={t0:0,last:0,len:0,ev:0};
/* Version 5.94: a hand scanner types the code key by key in a burst (several input events in a few hundred ms); a pasted or typed-by-hand value is not one. */
function isKeyBurst(el){return isScanBurst(el)&&fast.ev>=4;}
let scanAutoT=0;
function scanAutoSchedule(el){
  clearTimeout(scanAutoT);const v=el.value;
  if(!skey(v)||$('#dlg').open||!isKeyBurst(el))return;
  const ex=exactScan(v);
  if(!ex.length&&!findByScan(v).length){scanAutoT=setTimeout(()=>{if(el.isConnected&&el.value===v&&!$('#dlg').open&&ui.tab==='lager')scanNew(v);},250);return;}
  if(ex.length!==1)return;
  scanAutoT=setTimeout(()=>{if(!el.isConnected||el.value!==v||$('#dlg').open||ui.tab!=='lager')return;lastScan=true;scanAuto(ex[0]);if(!$('#dlg').open)lastScan=false;},250);
}
function isScanBurst(el){if(!el||typeof el.value!=='string')return false;const n=el.value.length;return n>=4&&fast.len===n&&(fast.last-fast.t0)<=40*n+60&&performance.now()-fast.last<1000;}
document.addEventListener('keydown',e=>{
  const tg=e.target,typing=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
  if(((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k')||(e.key==='/'&&!typing&&!$('#dlg').open)){e.preventDefault();if(!loginGate())openQs();return;}
  if(e.key==='Escape'&&tg&&tg.dataset&&tg.dataset.in==='scan'&&tg.value){e.preventDefault();tg.value='';ui.scan='';refreshScan();return;}
  if(tg&&tg.id==='qsIn'){
    if(e.key==='Escape'){e.preventDefault();const dl=$('#dlg');dl.classList.remove('qs');dlgCleanup();dl.close();return;}
    if(e.key==='ArrowDown'){e.preventDefault();qsMove(1);return;}
    if(e.key==='ArrowUp'){e.preventDefault();qsMove(-1);return;}
    if(e.key==='Enter'){e.preventDefault();qsRefresh();if(qs.items.length)qsRun(qs.sel,e.shiftKey);return;}
    if(e.key==='Tab'&&!e.shiftKey&&skey(tg.value)&&isScanBurst(tg)){const m=findByScan(tg.value);if(m.length===1){e.preventDefault();$('#dlg').classList.remove('qs');dlgCleanup();$('#dlg').close();const a=primaryAct(m[0]);ACT[a.act](m[0].id);}return;}
  }
  if(e.key==='Enter'&&(e.target.id==='bulkPlan'||e.target.id==='bulkDec')){e.preventDefault();const b=$('[data-act="decide-all"]');if(b)b.click();return;}
  if(e.key==='Enter'&&e.target.id==='histNew'){e.preventDefault();const b=$('[data-act="dev-addnote"]');if(b)b.click();return;}
  /* Enter in a field of a sheet presses the sheet's main button, so a hand-in
     or hand-out can be done from the keyboard: scan, Enter, Enter. */
  if(e.key==='Enter'&&tg&&tg.closest&&tg.closest('#dlg')&&((tg.tagName==='INPUT'&&tg.type!=='checkbox')||(tg.tagName==='SELECT'&&!tg.dataset.ch))&&tg.id!=='qsIn'&&!tg.dataset.in){
    if(tg.id==='simIccid'&&$('#simPhone')&&!$('#simPhone').value){e.preventDefault();$('#simPhone').focus();return;}
    const b=$('#dlg .dlg-actions .btn.primary');if(b&&!b.disabled){e.preventDefault();b.click();return;}
  }
  if(e.key==='Enter'&&tg&&tg.dataset&&tg.dataset.in==='stock'&&!drawing){stockRule(tg);return;}
  if(e.key==='Enter'&&tg&&tg.dataset&&tg.dataset.in==='gdpr-q'){e.preventDefault();ACT['gdpr-find']();return;}
  if(e.key==='Enter'&&tg&&tg.dataset&&tg.dataset.in==='inv-email'){e.preventDefault();invSend();return;}
  if(e.key==='Enter'&&tg&&tg.id==='phIn'){e.preventDefault();ACT['ph-send']();return;}
  /* Version 5.75: Enter in the number field of "Tag simkortet ud" presses OK. */
  if(e.key==='Enter'&&tg&&tg.dataset&&tg.dataset.swp!=null){e.preventDefault();ACT['sim-wait-ok']();return;}
  if(e.key==='Enter'&&tg&&tg.dataset&&/^db-(url|key|email|code)$/.test(tg.dataset.in||'')&&!e.isComposing){const b=$('[data-act="db-otp-verify"]')||$('[data-act="db-otp-send"]');if(b){e.preventDefault();b.click();return;}}
  if(e.key==='Enter'&&tg&&tg.dataset&&tg.dataset.in==='simq'&&tg.value.trim()){const m=simFind(tg.value);e.preventDefault();if(m.length===1)openSimEdit(m[0].id);else if(!m.length&&simDigits(tg.value).length>=18)openSimNew(simDigits(tg.value));}
  /* A scanner ends with Enter or Tab. One match opens the next step at once. */
  if(e.target&&e.target.dataset&&e.target.dataset.in==='scan'&&skey(e.target.value)&&(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey&&isScanBurst(e.target)))){
    const m=findByScan(e.target.value);
    if(e.key==='Enter'||m.length===1)e.preventDefault();
    if(!m.length&&/^\d{18,20}$/.test(simDigits(e.target.value))&&e.key==='Enter'){const code=simDigits(e.target.value),sm=simFind(code);ui.scan='';e.target.value='';refreshScan();if(sm.length===1)openSimEdit(sm[0].id);else openSimNew(code);return;}
    else if(m.length===1){lastScan=true;scanAuto(m[0]);if(!$('#dlg').open)lastScan=false;}
    else if(e.key==='Enter'&&!m.length&&!scanNew(e.target.value))toast('Ingen enhed passer til det, du scannede.');
  }
  /* The digital lists: Enter or Tab after a scan. */
  if(e.target&&e.target.dataset&&e.target.dataset.in==='tjek-scan'&&skey(e.target.value)&&(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey&&isScanBurst(e.target)))){e.preventDefault();clearTimeout(tjAutoT);tjekScan(e.target.value);}
});
/* The close event comes a moment after close(). If another sheet has been

$('#dlg').addEventListener('close',()=>{

  lastScan=false;
});

/* Version 6.13 (reliability review): an unexpected script error no longer leaves the page silent; the user gets a message, and the register stays as it is (the outbox is untouched). */
let errAt=0;function onErr(what){const now=Date.now();console.error(what);if(now-errAt<5000)return;errAt=now;try{toast('Noget gik galt i værktøjet. Prøv igen; hjælper det ikke, så genindlæs siden. Dine ændringer er gemt lokalt.');}catch(e){}}

if(PH)phoneStart();else{render();dbStart();}
