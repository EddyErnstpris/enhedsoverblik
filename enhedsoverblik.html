  main{padding:1.5rem max(1rem,env(safe-area-inset-right)) calc(6.5rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
  footer.foot{padding:0 max(1rem,env(safe-area-inset-right)) calc(6.5rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
  #toast,#toast[popover]{top:calc(var(--toph,3.4rem) + .5rem + env(safe-area-inset-top))}
}
@media (max-width:880px) and (max-height:430px){
  .tab{flex-direction:row;gap:.4rem;min-height:2.25rem;font-size:.75rem}
  .tab svg{width:1.3rem;height:1.3rem}
  main{padding-bottom:calc(4.4rem + env(safe-area-inset-bottom))}
}
/* Apple: on touch screens every control is at least 44 × 44 pt, and text fields
   use at least 16 px so iOS does not zoom when they get focus. */
@media screen and (max-width:880px),screen and (pointer:coarse){
  .btn,.btn.small,.chip,.top .btn{min-height:2.75rem;min-width:2.75rem;padding-top:.55rem;padding-bottom:.55rem}
  .xbtn{width:2.75rem;height:2.75rem}
  select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],input[type=email],input[type=url],input[type=tel],textarea{font-size:1.0625rem;min-height:2.75rem}
  textarea.mono{font-size:1rem}
  .tbl select{min-height:2.75rem}
  .checks label,label.switch{min-height:2.75rem;align-items:center}
  .checks input{margin-top:0}
  input[type=checkbox]{width:1.35rem;height:1.35rem}
  .qsi,.linkish{min-height:2.75rem}
  .empty .linkish{min-height:0;padding:.7rem 0;margin:-.7rem 0}
  .dbbtn{min-width:2.75rem;min-height:2.75rem}
  .qsi .act{display:none}
  .tbl select{background-color:var(--fill)}
  .toolbar select{flex:1 1 auto}
  .switch input[type=checkbox]{width:51px;height:31px}
  details>summary{min-height:2.75rem;display:flex;align-items:center;gap:.4rem}
  details>summary::before{content:"";width:.45rem;height:.45rem;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 .2rem}
  details[open]>summary::before{transform:rotate(45deg)}
  .simdone>summary::before,.regmenu>summary::before{display:none}
  .regmenu>summary{display:inline-flex;justify-content:center}
  .room{min-height:2.75rem}
  .tab{min-height:2.75rem}
  .sortb,.tbl .sortb{min-height:2.75rem;min-width:2.75rem;padding:0 .3rem;margin:0 -.3rem}
}
@media (prefers-contrast: more){
  :root{--sep:rgba(60,60,67,.45);--muted:#3A3A3E;--faint:#3E3E42;--fill:rgba(118,118,128,.2)}
  select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],input[type=email],input[type=url],input[type=tel],textarea{border-color:var(--glyph)}
  .switch input{box-shadow:inset 0 0 0 1px var(--glyph)}
  .kpi,.list,.tasks,.bldg,.panel,.tblwrap,.stat>div,.mlist,.depot,.done{outline:1px solid var(--sep)}
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark){
  :root{--sep:rgba(235,235,245,.45);--muted:#D1D1D6;--faint:#C7C7CC}
}
@media (prefers-reduced-transparency: reduce){
  .top::before,.tabs{-webkit-backdrop-filter:none !important;backdrop-filter:none !important;background:var(--bg) !important}
  dialog::backdrop{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.5)}
}
@media (max-width:880px){
  .empty{margin-top:.5rem}
  .empty .appicon{width:3.6rem;height:3.6rem;margin-bottom:.9rem}
  .empty li{padding:.6rem 0}
  .empty ol{margin-bottom:1.2rem}
}
@media (max-width:640px){
  .flag{white-space:normal}
  .dept-edit{grid-template-columns:minmax(0,1fr) auto;padding-bottom:.8rem;margin-bottom:.8rem;border-bottom:1px solid var(--sep)}
  .dept-edit:last-of-type{border-bottom:0}
  .dept-edit .xbtn.del{grid-column:2;grid-row:1}
  .dept-edit input+input{grid-column:1/-1;grid-row:2}
  .dept-edit input:first-child{grid-column:1;grid-row:1}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh}
  dialog:not(.qs)::before{content:"";display:block;height:.5rem}
  dialog .dlg-actions{position:sticky;bottom:0;background:var(--elevated);padding:.7rem 0 calc(.4rem + env(safe-area-inset-bottom));margin-bottom:-1.2rem;z-index:2;border-top:1px solid var(--sep)}
  dialog.qs{max-height:100dvh;height:100dvh;border-radius:0}
  dialog.qs{margin:auto 0 0;width:100vw}
  dialog[open]{animation:sheet .34s cubic-bezier(.2,.9,.3,1)}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
@media print{
  :root{--who:#000;--bg:#fff;--surface:#fff;--fill:#f0f0f0;--fill-2:#e6e6e6;--ink:#000;--muted:#444;--faint:#555;--glyph:#777;--sep:#bbb;--accent:#000;--accent-fill:#000;--accent-ink:#fff;--accent-soft:#eee;--link:#000;
    --s30:#7D5200;--s30-bg:#FBF0C4;--s60:#AD4500;--s60-bg:#FCE4CF;--s90:#B00012;--s90-bg:#FADBD8;--ok:#1E7B34;--ok-bg:#DAEEE0;--shadow:none}
  .top,.toolbar,.no-print,#toast,footer.foot{display:none !important}
  body{font-size:11pt}
  main{padding:0;max-width:none}
  .list{border:1px solid #bbb;border-radius:8px}
  .irow{break-inside:avoid;grid-template-columns:5.6rem 1.2fr 1fr 1fr}
  .irow .ctl select,.irow .ctl input,.irow .ctl button,.irow .ctl .rule,.irow .ctl .muted,.irow .ctl .row-actions{display:none}
  .simlnk{color:var(--ink)!important} /* 6.6: the card's number is content on paper, not a control */
  .print-only{display:block}
  .group{break-inside:auto}
  body.print-area>*:not(#printArea){display:none !important}
  body.print-area #printArea{display:block}
}
</style>

  S.devices.forEach(d=>d.history.forEach(h=>{if(h.e&&h.e.ret&&(!h.e.until||h.e.until<=t)){delete h.e.ret;delete h.e.until;if(!/ · GDPR slettet$/.test(h.t))h.t=(h.t+' · GDPR slettet').slice(0,300);n++;}}));
  /* Version 6.3 (Eddy 18-10-2026): a person who has had no device in use for gdprDays days is deleted everywhere (names in user fields, lists,
     the tool's own history lines, notes, leavers). S.gone holds the day a name was last seen without a device; it is cleared when the person
     holds a device again. Names are keyed with nkey, so two spellings count as one person. */
  if(!S.gone||typeof S.gone!=='object')S.gone={};
  const held=heldKeysOf(S),all=new Map();
  S.devices.forEach(d=>namesOfS(S,d).forEach(nm=>{const k=nkey(nm);if(k&&!held.has(k))all.set(k,nm);}));
  S.inactive.rows.forEach(r=>{const k=nkey(r.user);if(k&&!held.has(k))all.set(k,r.user);});
  String(S.leavers||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(nm=>{const k=nkey(nm);if(k&&!held.has(k))all.set(k,nm);});
  Object.keys(S.gone).forEach(k=>{if(!all.has(k))delete S.gone[k];});
  const lim=addDays(t,-gdprDays(S)),del=[];
  all.forEach((nm,k)=>{if(!S.gone[k])S.gone[k]=t;else if(S.gone[k]<=lim)del.push(nm);});
  if(del.length){const keep=state;state=S;try{del.forEach(nm=>{S.devices.forEach(d=>scrubOwn(d,[nm]));globalForget([nm]);});}finally{state=keep;}del.forEach(nm=>{delete S.gone[nkey(nm)];});p=del.length;}
  if(n||p){S.log.unshift({d:t,t:'GDPR slettet: '+(n?pl(n,'navn','navne')+' i historikken':'')+(n&&p?', ':'')+(p?pl(p,'person','personer')+' uden enhed i '+gdprDays(S)+' dage':'')});S.log=S.log.slice(0,40);}
  return n+p>0;
}

const CAT_RE=/\(\s*(\d{1,3})\s*dage\s*\)/i;

  if(cells.some(c=>/^\d{14,16}$/.test(c)||/^(?=.*[A-Z])(?=.*\d)[A-Z0-9]{9,14}$/.test(c)))return false;

function parseDelimited(text,d){

    else if(quotes&&c==='"'&&cell==='')q=true;

    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;

function segment(rows,ctx){

    if(!cur.real&&(isHeaderRow(r)||r.some(isDeviceId))){cur.real=true;cur.cat=ctx.cat;ctx.cat=null;}
    cur.rows.push(r);

function tablesFromHtml(html){

    if(n.nodeType===3){const m=CAT_RE.exec(n.nodeValue);if(m)ctx.cat=catOf(m);continue;}
    if(n.tagName==='TABLE'){
      if(n.querySelector('table'))continue;
      const rows=Array.from(n.rows).map(tr=>Array.from(tr.cells).map(c=>c.textContent));
      segment(rows,ctx).forEach(t=>out.push(t));
      let last=n;while(last.lastChild)last=last.lastChild;
      w.currentNode=last;
    }else if(!n.querySelector('table')){
      const t=clean(n.textContent);

function tablesFromText(text){

function parseDate(s){

    else d.mismatch[src]=today();

try{if(typeof ResizeObserver==='function'){const ro=new ResizeObserver(()=>topH());const w=()=>{const h=document.querySelector('header.top');if(h){ro.observe(h);topH.ro=true;}else setTimeout(w,50);};w();}}catch(e){}
function fitPaper(){

function toastLift(t,on){
  /* Over an open sheet the message goes into the top layer, so it is seen and read. */
  if(!t.showPopover)return;
  try{
    if(on){if(!t.hasAttribute('popover'))t.setAttribute('popover','manual');if(t.matches(':popover-open'))t.hidePopover();t.showPopover();}
    else if(t.hasAttribute('popover')){if(t.matches(':popover-open'))t.hidePopover();t.removeAttribute('popover');}
  }catch(e){}
}
function toastHide(){const t=$('#toast');if(t){t.classList.remove('show');toastLift(t,false);}clearTimeout(toast.t);}
/* Version 5.96 (Eddy 18-10-2026): opts.green gives the dusty green box with white text (used for "Logget ind."). */
function toast(msg,opts){
  const t=$('#toast');t.textContent=msg;t.classList.toggle('green',!!(opts&&opts.green));
  const dl=$('#dlg');toastLift(t,!!(dl&&dl.open));
  t.classList.add('show');
  const ms=Math.min(10000,3000+50*String(msg).length);
  const hide=()=>{if((matchMedia('(hover:hover) and (pointer:fine)').matches&&t.matches(':hover'))||t.contains(document.activeElement)){toast.t=setTimeout(hide,800);return;}t.classList.remove('show');setTimeout(()=>{if(!t.classList.contains('show'))toastLift(t,false);},400);};
  clearTimeout(toast.t);toast.t=setTimeout(hide,ms);
}

function oldestWaiting(){const w=state.devices.filter(d=>inStock(d)&&stockState(d)==='ikke'&&!mustReturn(d)&&stockAge(d)!=null&&stockAge(d)>state.stock.waitDays);w.sort((a,b)=>(a.stockSince||'9').localeCompare(b.stockSince||'9'));return w[0]||null;}
function stockTasks(){
  const s=state.stock,out=[];
  const st=state.devices.filter(inStock);
  const wait=st.filter(d=>stockState(d)==='ikke'&&!mustReturn(d)&&stockAge(d)!=null&&stockAge(d)>s.waitDays).length;
  if(wait){const o=oldestWaiting();out.push({n:wait,cls:'s60',text:(wait===1?'enhed har':'enheder har')+' ventet mere end '+s.waitDays+' dage på at blive klar'+(o?'. Nulstil '+(o.label||o.serial||'den ældste')+' først ('+pl(stockAge(o),'dag','dage')+')':''),act:'tab',arg:'lager'});}
  const old=readyList().filter(d=>stockAge(d)!=null&&stockAge(d)>s.days).length;
  if(old)out.push({n:old,cls:'s60',text:(old===1?'enhed har':'enheder har')+' ligget klar i mere end '+s.days+' dage. Udlevér, eller send retur',act:'tab',arg:'lager'});
  const used=state.devices.some(d=>d.deptId===LAGER||d.history.some(h=>/^(Indleveret til lager|Placering: Lager|Klar på lager)/.test(h.t)));
  [['Telefon','telefon','telefoner'],['Tablet','tablet','tablets']].forEach(([ty,one,many])=>{
    const n=readyList(ty).length,l=stockLimits(ty),over=n-l.max,miss=l.min-n;
    if(over>0)out.push({n:over,cls:'plain',text:(over===1?'klar '+one:'klare '+many)+' over loftet på '+l.max+'. Send overskud retur',act:'tab',arg:'lager'});

}

/* What to answer for a device on the inactive list: devices in stock follow
   the stock rules; a device whose user has left follows the stock need. */
function suggestFor(r,d){
  const ty=d.type==='Tablet'?'Tablet':'Telefon';
  if(!inStock(d)){
    if(r.cat===90)return {decision:'retur',text:'Sender retur'};
    if(d.shared){const w=sharedWord(d);return r.cat===60?{decision:'laasop',plan:w+', bruges af skiftende vikarer',text:w+'. Lås den op. Plan: bruges af skiftende vikarer'}:{decision:'',text:w+'. Beholdes'};}
    const lv=leaverSet();if(!(d.lastUser&&lv.has(nkey(d.lastUser))))return null;
    const need=readyList(ty).length<stockLimits(ty).min;
    if(r.cat===60)return need?{decision:'laasop',plan:STOCK_PLAN,text:'Bruger fratrådt. Hent enheden. Lageret mangler '+(ty==='Tablet'?'tablets':'telefoner')+', så lås op. Plan: '+STOCK_PLAN}:{decision:'retur',text:'Bruger fratrådt. Hent enheden, og send den retur'};
    return {decision:'',text:'Bruger fratrådt. Hent enheden, og indlevér den på lageret'};
  }
  const rl=readyList(ty),n=rl.length+(rl.includes(d)?0:1),over=n>stockLimits(ty).max;
  if(r.cat===90||over)return {decision:'retur',text:'Sender retur'+(over?' (over loftet)':'')};
  if(r.cat===60)return {decision:'laasop',plan:STOCK_PLAN,text:'Lås den op. Plan: '+STOCK_PLAN};
  return {decision:'',text:'Beholdes. Udlevér den som en af de næste'};
}
/* Rows whose suggestion differs from what is chosen. */
function openSuggestions(list){
  return list.filter(x=>{if(x.r.cat===90||x.r.decision||rowDone(x.r))return false;const s=suggestFor(x.r,x.d);return !!s&&!!s.decision;});
}
function stockSuggestion(r,d){
  const s=suggestFor(r,d);if(!s)return '';
  const same=r.decision===s.decision&&(s.decision!=='laasop'||r.plan===s.plan);
  if(r.decision&&!same)return '';
  return '<div class="muted" style="font-size:.8125rem">Forslag: '+esc(s.text)+'</div>'+
    (same||r.decision?'':'<div class="row-actions"><button class="btn small" data-act="stock-suggest" data-arg="'+d.id+'">Brug forslaget</button></div>');
}

function regSorted(){
  const ls=regList(),k=ui.reg.sort,dir=ui.reg.dir,o=placeOrder();
  const key=d=>k==='user'?(d.lastUser||'').toLowerCase():k==='seen'?(d.lastSeen||''):k==='place'?o(d.deptId):k==='status'?STATUSES.indexOf(d.status):k==='type'?(d.type+' '+d.model).toLowerCase():(d.label||'').toLowerCase();
  /* Empty values go last whichever way the column is sorted. */
  const out=ls.slice().sort((a,b)=>{const x=key(a),y=key(b),ex=x==='',ey=y==='';if(ex!==ey)return ex?1:-1;return (x<y?-1:x>y?1:0)*dir||(a.label||'~').localeCompare(b.label||'~');});

  const pin=ui.reg.pin;if(pin){const d=devById(pin.id);if(d){const i=out.indexOf(d);if(i>=0)out.splice(i,1);out.splice(Math.min(pin.idx,out.length),0,d);}}

}

function regList(){
  const q=norm(ui.reg.q),im=inactMap(),lv=leaverSet();

    if(ui.reg.ids&&!ui.reg.ids.includes(d.id))return false;
    if(ui.reg.dept==='__none'){if(valid.has(d.deptId))return false;}
    else if(ui.reg.dept&&d.deptId!==ui.reg.dept)return false;
    if(ui.reg.status&&d.status!==ui.reg.status)return false;
    if(ui.reg.type==='Vikartelefon'){if(!(d.shared&&d.type==='Telefon'))return false;}else if(ui.reg.type&&d.type!==ui.reg.type)return false;
    const s=ui.reg.special;

    if(s==='leaver'&&!(d.lastUser&&lv.has(nkey(d.lastUser))&&ACTIVE.has(d.status)&&!inStock(d)))return false;
    if(s==='shared'&&!d.shared)return false;

function handleParsed(kind,tables,img){

      const res=(map.serial!=null||map.imei!=null)?recordsFrom(s.data,map):{recs:[]};
      return {cat,recs:res.recs,n:s.data.length};
    }).filter(t=>t.recs.length||t.cat)};
    if(!pend.inact.tables.some(t=>t.recs.length)){pend.inact=null;toast(img?'Fandt ingen enheder med serienummer eller IMEI i billedet. Tag et skarpere skærmbillede af e-mailen, og prøv igen.':'Fandt ingen tabeller med serienummer eller IMEI.');return;}

function decodeBuffer(buf){
  const b=new Uint8Array(buf);
  if(b[0]===0xFF&&b[1]===0xFE)return new TextDecoder('utf-16le').decode(buf);
  if(b[0]===0xFE&&b[1]===0xFF)return new TextDecoder('utf-16be').decode(buf);
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}
  catch(e){return new TextDecoder('windows-1252').decode(buf);}
}

const PLACE_ASK='Navnet på sidste bruger slettes fra enheden og historikken. Har personen ikke andre enheder i brug, slettes navnet også i resten af registeret og på listen over fratrådte. Det kan ikke fortrydes. Vil du fortsætte?';
function placeAsks(d,v){return v===LAGER&&d.deptId!==LAGER&&ACTIVE.has(d.status)&&namesOf(d).length>0;}
function placeDevice(d,v){
  const was=d.deptId===LAGER,fromPl=placeName(d.deptId),act=ACTIVE.has(d.status);
  if(v===d.deptId){if(d.placeHint){d.placeHint='';hist(d,'Placering bekræftet: '+placeName(v));}return '';}
  d.placeHint='';
  const names=v===LAGER&&!was&&act?namesOf(d):[];
  d.deptId=v;
  if(v===LAGER&&!was){delete d.use;d.stockSince=today();d.missingSince='';if(d.status==='I drift')d.status='Afventer nulstilling';d.readySince=d.status==='Reserve'?today():'';if(act){forgetDevice(d,names);d.lockUser='';d.mismatch={};if(!d.label&&!isEmptyManual(d))giveLabel(d);}}
  /* Out of the stock without "Udlevér": no list may set a user until the
     device sheet says so, because the lists may still show the old user. */
  else if(v!==LAGER&&was){leaveStock(d);if(act){d.lockUser=today();d.userBy={};d.mismatch={};if(d.status==='Reserve'||d.status==='Afventer nulstilling')d.status='I drift';}}
  hist(d,'Placering: '+placeName(v),act&&v===LAGER&&!was?{k:'Indleveret',who:'',place:fromPl}:act&&was&&v!==LAGER?{k:'Udleveret',who:'',place:placeName(v)}:null);
  return act&&was&&v!==LAGER&&!d.lastUser&&!d.shared?'Brug Udlevér på fanen Lager næste gang, så modtageren bliver registreret.':'';
}
function statusAsks(d,v){
  if(v===d.status)return '';
  const enter=d.deptId===LAGER&&!ACTIVE.has(d.status)&&ACTIVE.has(v);
  if(enter&&namesOf(d).length)return 'Enheden kommer på lager, og '+PLACE_ASK.charAt(0).toLowerCase()+PLACE_ASK.slice(1);
  const gone=GONE.has(v)&&!GONE.has(d.status);
  if(gone&&namesOf(d).length)return (v==='Bortkommet'?'Meld først bortkomsten efter kommunens procedure. ':'')+GONE_ASK;
  return '';
}
function statusDevice(d,v){
  if(v==='I drift'&&d.deptId===LAGER)v='Afventer nulstilling';
  if(v===d.status)return null;
  const enter=d.deptId===LAGER&&!ACTIVE.has(d.status)&&ACTIVE.has(v),names=enter?namesOf(d):[];
  const gone=GONE.has(v)&&!GONE.has(d.status);
  d.status=v;
  if(!ACTIVE.has(v))d.leaveDate='';
  if(enter){if(!d.stockSince)d.stockSince=today();forgetDevice(d,names);d.lockUser='';d.mismatch={};if(!d.label&&!isEmptyManual(d))giveLabel(d);}
  if(d.deptId===LAGER){if(!ACTIVE.has(v)){d.deptId='';leaveStock(d);d.lockUser=today();d.userBy={};d.mismatch={};}else if(v==='Reserve'&&!d.readySince)d.readySince=today();else if(v!=='Reserve')d.readySince='';}
  const sev=v==='Sendt retur'?{k:'Retur til Supporten',who:'',place:'Supporten'}:v==='Bortkommet'?{k:'Meldt bortkommet',who:'',place:''}:v==='Reserve'&&d.deptId===LAGER?{k:'Klar',who:'',place:'Lager'}:null;
  if(gone)leaveForGood(d);
  hist(d,'Status: '+stLabel(v),sev);
  return simOnStatus(d,v);
}

/* Code 128 (set B), drawn as SVG, so labels can be scanned. */
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128(text){
  const vals=[104];
  for(const ch of String(text).replace(/[^\x20-\x7E]/g,'')){const c=ch.charCodeAt(0);if(c<32||c>126)return '';vals.push(c-32);}
  let sum=104;for(let i=1;i<vals.length;i++)sum+=vals[i]*i;
  vals.push(sum%103,106);
  let x=10,bars='';
  vals.forEach(v=>{const p=C128[v];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+='<rect x="'+x+'" y="0" width="'+w+'" height="40"/>';x+=w;}});
  return '<svg class="bc" viewBox="0 0 '+(x+10)+' 40" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">'+bars+'</svg>';
}
/* The print area is cleared after printing. Safari on iPhone and iPad returns
   from print() at once, so only afterprint (or a long fallback) clears it.
   6.42 (Eddy 06-11-2026, picture of the iPhone print window with 239 pages): on iPhone and iPad afterprint comes at once,
   before the print window has drawn the pages, so the whole page was printed. There the print area stays, and the 2-minute fallback is not used.
   6.44 (Eddy 06-11-2026, pictures: one label until the Brother printer is chosen, then the whole page): the print window draws the page again
   when a printer or paper is chosen, and the touches in it reached the page, so 6.43 cleared the area too early. Now it stays until another
   tab is opened or the next print replaces it. */
const IOS_PRINT=/iP(hone|ad|od)/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
let printTimer=null,printAt=0;
function printDone(){document.body.classList.remove('print-area');$('#printArea').innerHTML='';clearTimeout(printTimer);}
window.addEventListener('afterprint',()=>{if(!IOS_PRINT)printDone();});
function printArea(html,noPrint){
  const a=$('#printArea');a.innerHTML=html;document.body.classList.add('print-area');printAt=Date.now();
  clearTimeout(printTimer);if(!IOS_PRINT)printTimer=setTimeout(()=>{if(!matchMedia('print').matches)printDone();},120000);
  if(!noPrint)window.print();
}

    ['Gå huset rundt','Gå-liste (udskriv eller PDF) giver en liste at gå huset rundt med, og enhederne kan også tjekkes digitalt fra telefonen (se Rapporter).']]}],
  tips:['90 dage kan ikke låses op. De enheder skal altid sendes retur.','60 dage kan låses op ved at ringe til Supporten. Beslutningen skrives på fanen Inaktive enheder.','30 dage er ikke låst og skal ikke låses op. De står på listen, så du er opmærksom på dem, før de bliver låst efter 60 dage. Vælg Beholdes, eller Sender retur, hvis enheden ikke skal bruges mere.','Sæt alle til (bjælken over listen) giver alle enheder uden beslutning samme beslutning på én gang, fx Lås op med en plan.','Fluebenet Fundet ud for en enhed hjælper dig, mens du går runden på skærmen. Det gemmes ikke; vil du gemme krydser og bemærkninger, så brug den digitale liste under Rapporter.']},
 {id:'indlever',t:'En medarbejder stopper (indlevering)',min:3,intro:'Når en medarbejder stopper, afleverer han eller hun enheden til dig.',
  sec:[
   {img:'lager',alt:'Fanen Lager med scanfeltet og listen Forventet retur',steps:[
    ['Scan enheden','Scan labelen med scanneren, eller skriv label, serienummer eller IMEI, og tryk Enter. Er enheden ikke på lageret, åbner boksen Indlevér af sig selv.'],
    ['Forventet retur','Her står enheder, hvor brugeren snart stopper. Afdelingslederen afleverer enheden til dig. Du kan også trykke Indlevér ud for enheden.']]},
   {img:'hi',alt:'Boksen Indlevér, der spørger, om enheden skal ind på lageret, med punktet om simkortet og knappen Indlevér',steps:[
    ['Skal den ind på lageret?','Tjek, at simkortet sidder i enheden, og sæt fluebenet.'],
    ['Allerede nulstillet?','Har du nulstillet enheden, mens du står med den, så sæt også fluebenet "Enheden er allerede nulstillet". Så åbner Markér som klar lige efter Indlevér, og du skal ikke scanne den igen.'],
    ['Tryk Indlevér','Enheden er nu på lager som ikke klar. Navnet fjernes fra enheden, men står i enhedens historik i en periode (antal dage sættes på fanen GDPR) og slettes så automatisk. Tryk Annullér, hvis den ikke skal ind.']]}],
  tips:['Sæt enheden til opladning, og nulstil den.','Ved indlevering slettes Cura/Admin fra telefonen. Det vælges igen, når den udleveres næste gang.','Flere enheder på én gang: Får du en stak enheder fra afdelingslederne, så scan dem én efter én: fluebenet har fokus (mellemrum sætter det, Enter indleverer), og scanfeltet er klar til den næste med det samme.','Ingen scanner ved hånden? Lager → Scan med kamera læser labelen eller stregkoden med IMEI eller serienummer (fx på æsken) med pc\'ens kamera, og Scan med telefon gør det samme med din telefons kamera, så koden lander på pc\'en.','Er enheden i stykker, så sæt status til Skal sendes retur bagefter: en telefon eller tablet, der skal repareres, sendes altid retur.','Er enheden helt ny og ikke i registeret, spørger systemet, om den skal oprettes og ind på lageret. Udfyld så type og model. Enheden får en label af sig selv, og Lager viser, at labelen venter på udskrift.','Skal enheden sendes retur (90 dage eller Sender retur), og scanner du den, når den er på lageret, tilbyder boksen kun Markér som sendt retur. Den kan ikke gøres klar eller udleveres.']},
 {id:'klar',t:'Gør en enhed klar',min:2,intro:'Når en enhed er nulstillet, gør du den klar til en ny medarbejder.',
  sec:[
   {img:'ready',alt:'Vinduet Markér som klar med fire punkter',steps:[
    ['Tjek de fire punkter','Scan enheden på fanen Lager. Boksen spørger, om du vil udlevere den; tryk Markér som klar i stedet, så åbner vinduet. Sæt flueben, eller tryk Alle fire er i orden.'],
    ['Tryk Markér som klar','Lad den til 50–70 %, sluk den, og læg den i zonen Klar.']]},
   {img:'readymany',alt:'Vinduet Markér flere som klar med en liste og afkrydsning',steps:[
    ['Vælg enhederne','Venter flere enheder, så tryk Markér flere som klar under Ikke klar på Lager. Sæt flueben ved dem, der er nulstillet.'],
    ['Tjek de fire punkter','De gælder for alle de valgte enheder.'],
    ['Tryk på knappen','Knappen siger, hvor mange enheder der bliver klar.']]}
   ,{img:'koe',alt:'Listen Ikke klar på Lager med mærket Nulstil denne først og et orange mærke Ikke klar i 9 dage',steps:[
    ['Nulstil denne først','Under Ikke klar på Lager har den enhed, der har ventet længst, mærket Nulstil denne først. Tag den først. Dashboard peger på den samme. Enheder, der skal sendes retur, springes over: de skal ikke nulstilles.'],
    ['Ikke klar i … dage','Orange mærke på de enheder, der har ventet længere end tilladt. Antallet af dage sættes under Opsætning → Lager (Dage ikke klar før opgave).']]}],
  tips:['Tallene øverst på Lager viser, hvor mange telefoner og tablets der er klar, og hvor mange der mindst skal være.']},
 {id:'udlever',t:'Ny medarbejder (udlevering)',min:3,intro:'Giv altid den enhed, der har ligget længst.',
  sec:[
   {img:'klarliste',alt:'Listen Klar på fanen Lager, delt i Med simkort og Uden simkort, med mærket Næste til udlevering',steps:[
    ['Find den næste','Under Klar står den enhed, der skal bruges først, med mærket Næste til udlevering.'],
    ['Med og uden simkort','Hver liste på Lager er delt i Med simkort og Uden simkort, så du kan se, hvilke enheder der mangler et kort.'],
    ['Tryk Udlevér','Eller scan enheden.']]},
   {img:'iphones',alt:'Knappen iPhones øverst på Lager og listen Klar med kun iPhones',steps:[
    ['Skal det være en iPhone?','Tryk knappen iPhones øverst på Lager. Så viser alle lister kun iPhones.'],
    ['Alle enheder igen','Tryk iPhones igen (✓ iPhones), så ser du alle enheder.']]},
   {img:'scanbox',alt:'Boksen, der spørger, om en enhed på lageret skal udleveres',steps:[
    ['Scanner du en enhed, der er på lageret','Systemet spørger, om du vil udlevere den.'],
    ['Ja, udlevér','Åbner vinduet Udlevér. Tryk Nej, hvis ikke.']]},
   {img:'ho',alt:'Vinduet Udlevér med modtager, afdeling og simkort',steps:[
    ['Skriv modtageren','Navnet på den nye medarbejder.'],
    ['Vælg afdelingen','Kom enheden fra en afdeling, er den valgt på forhånd. Ellers er den afdeling valgt, du sidst udleverede til, så flere enheder til samme afdeling går hurtigt.'],
    ['Cura eller Admin','Vælg, om telefonen er en Cura- eller en Admin-telefon. Det skal vælges for telefoner og vikartelefoner, før du kan trykke Udlevér; tablets har det ikke.'],
    ['Simkortet','Har enheden intet kort, er det ældste ledige kort fra kartoteket valgt. Efter Udlevér viser en boks, hvilken lomme kortet skal tages fra.'],
    ['Tjek de to punkter','Opdateringer og test.'],
    ['Tryk Udlevér','Enheden er nu i drift i afdelingen.']]}],
  tips:['Uden et simkort kan enheden ikke udleveres: en telefon eller tablet kan ikke være i drift uden simkort.','Har ligget klar for længe står ved en enhed, der har været klar længere end Dage klar før opgave (Opsætning → Lager). Udlevér den, eller send den retur.','Står enheden under Uden simkort, så sæt et kort i først (Simkort → Sæt i enhed), eller lad Udlevér vælge et.','En enhed, der skal sendes retur (90 dage eller Sender retur), kan ikke udleveres. Systemet siger det og tilbyder Markér som sendt retur.']},
 {id:'register',t:'Find og ret en enhed (Register)',min:5,intro:'Register er listen over alle enheder.',
  sec:[
   {img:'reg',alt:'Register med søgefelt, filtre og listen',steps:[
    ['Søg','Skriv label, serienummer, IMEI, telefonnummer eller navn.'],
    ['Vælg','Vis kun en placering, en status eller en type.'],
    ['Genveje','De blå knapper viser fx dem, der er i drift (knappen I drift), der er uden placering (knappen Uden placering), hvor brugeren er fratrådt, eller som er i drift uden simkort (knappen Uden simkort ses kun, når der er nogen). Knapperne Cura og Admin viser de telefoner, og Uden Cura/Admin dem, hvor der ikke er valgt. På telefonen står knapperne i én række, du ruller sidelæns.'],
    ['Bemærk','Kolonnen Bemærk viser enhedens tilstand: I drift, På lager (klar eller ikke klar), Skal sendes retur, Sendt retur eller Bortkommet, og advarsler som Uden simkort, Bruger fratrådt eller Ikke på listerne.'],
    ['Ret direkte','Placering og status rettes direkte i listen. Enheden bliver på sin linje, til du klikker et andet sted, så den ikke hopper væk, mens du vælger. Vælger du Lager, flytter den derover med det samme.'],
    ['Simkortets nummer','Under serienummeret står telefonnummeret på kortet i enheden, fx "Tlf. 30678495". Tryk på nummeret, så åbner kortets detaljer. Det samme gælder på Lager, Inaktive enheder og de digitale lister.']]},
   {img:'models',alt:'Register: boksen med enheder uden type fordelt på modeller, med et valg af type ud for hver model',steps:[
    ['Enheder uden type','Øverst i Register står fx "7 enheder uden type fordelt på 3 modeller". Klik på linjen, så ser du modellerne og antallet af enheder.'],
    ['Vælg typen én gang','Vælg Telefon eller Tablet ud for modellen. Alle enheder med modellen får typen, og systemet husker den, så næste måneds liste også får den rigtige type. Det samme sker, når du vælger typen på én enhed.']]},
   {img:'hint',alt:'Enhedens vindue med beskeden Placeringen er foreslået, knappen Bekræft og feltet Placering',steps:[
    ['Placeringen er foreslået','Får en enhed en bruger fra den komplette liste, og har brugeren en anden enhed med placering, får den nye enhed samme placering som forslag. I Register har den flaget Placering foreslået, og knappen Placering foreslået viser alle.'],
    ['Tryk Bekræft','Passer placeringen, så tryk Bekræft.'],
    ['Eller vælg en anden','Vælg den rigtige placering. Så er den også bekræftet.']]},
   {img:'lblnew',alt:'Lager med beskeden 2 labels venter på udskrift og knappen Udskriv de 2 labels',steps:[
    ['Labels venter','Nye enheder får en label af sig selv: fra listen, ved scanning og med Tilføj enhed. Lager viser, hvor mange labels der venter på udskrift, og numrene.'],
    ['Udskriv dem','Tryk Udskriv de … labels. Arket har kun de nye labels. Når de er udskrevet, forsvinder beskeden.']]},
   {img:'lblprint',alt:'Vinduet Udskriv labels med Hvilke enheder og knappen Udskriv',steps:[
    ['Hvilke enheder','Nye labels, alle med label, eller kun dem på lageret. Labels printes på labelprinteren (Brother QL) på rullen 62 mm: én label pr. side på 62 × 29 mm. Skal kun én enhed have en ny label, fordi stregkoden er slidt eller væk, så åbn enheden og tryk Udskriv label.'],
    ['Udskriv','Vælg labelprinteren og papiret 62 mm i udskriftsvinduet, og slå Tilpas til siden fra. Fra telefonen åbner du siden i Safari, trykker Udskriv og vælger Brother-printeren og en papirstørrelse på 62 mm i bredden.']]},
   {img:'dev',alt:'Enhedens vindue med alle oplysninger',steps:[
    ['Klik på labelen','Så åbner enhedens vindue med alle oplysninger, historik og simkort.'],
    ['Status','Klar betyder nulstillet og klar til udlevering. Er enheden gået i stykker, så vælg Skal sendes retur: en enhed, der skal repareres, sendes altid retur. Er den væk, så vælg Bortkommet. En enhed uden for lageret kan kun sættes I drift, når den har et simkort.'],
    ['Type','Telefon, Tablet eller Vikartelefon. En vikartelefon bruges af skiftende vikarer, og der gemmes ingen bruger på den.'],
    ['Cura eller Admin','En telefon i drift er Cura eller Admin (valgt ved Udlevér). Er det valgt forkert, så ret det her; ændringen står i historikken.']]}],
  tips:['Sæt flueben ved flere enheder for at rette dem alle på én gang.','På telefonen ligger Tilføj enhed som en rund plus-knap nederst til højre, og Tildel labels og Eksportér til Excel ligger under de tre prikker ved overskriften.','En telefon i drift har mærket Cura eller Admin ved enheden, så du kan se det i listerne.','Er en enheds stregkode slidt eller væk, så åbn enheden og tryk Udskriv label. Så kommer kun den enheds label ud af labelprinteren.','Serienummeret kan scannes ind i enhedens vindue: tryk Scan ved Serienummer, og hold stregkoden med serienummeret foran kameraet. Med håndscanneren stiller du dig i feltet Serienummer og scanner.','Er enheden en iPhone, så slå iPhone til i enhedens vindue. Så får den mærket iPhone og kommer med, når du trykker iPhones på Lager.','Vælger du typen (Telefon, Tablet eller Vikartelefon), før labelen er udskrevet, får enheden en label, der passer: ENH-… bliver TLF-… eller TAB-…. En udskrevet label eller en, du selv har skrevet, ændres aldrig.','Labelen er enhedens navn, fx TLF-001. Nye enheder får en label af sig selv; Tildel labels giver ældre enheder uden label et nummer. Lager → Udskriv labels printer klistermærker med labelen og en stregkode på labelprinterens rulle (62 mm, én label på 62 × 29 mm ad gangen), alle eller kun de nye, også fra telefonen. Én label pr. enhed.','Flaget Uden simkort ved en enhed betyder, at den står i drift uden kort. Sæt et kort i (tryk på labelen → Sæt i enhed), eller indlevér enheden.']},
 {id:'simkort',t:'Simkort og simkort-kartoteket',min:5,intro:'Simkortet følger telefonen. Når enheden skal sendes retur, tages kortet ud og lægges i simkort-kartoteket på lageret: en Rolodex, hvor hver plastiklomme har en label (A1, A2, A3 …).',
  sec:[
   {img:'sim',alt:'Siden Simkort med søgning, tal og kort på lager med deres lomme',steps:[
    ['Find Simkort','På fanen Lager, knappen Simkort.'],
    ['Søg','På telefonnummer, ICCID, navn eller label.'],
    ['Kort på lager','Ældste først, og ud for hvert kort står dets lomme i kartoteket (fx Lomme A1). Tryk Sæt i enhed for at give kortet til en enhed.']]},
   {img:'simfoto',alt:'Siden Simkort med knappen Læs simkort fra billede',steps:[
    ['Læs simkort fra billede','Har kortet ingen stregkode, så tryk Læs simkort fra billede, og tag et billede af den side, hvor tallene står, tæt på og skarpt. På telefonen kan du tage billedet med det samme. Billedet læses på telefonen eller pc\'en og sendes ingen steder hen.']]},
   {img:'simfoto2',alt:'Vinduet Nyt simkort med ICCID udfyldt fra billedet og feltet Telefonnummer',steps:[
    ['ICCID er udfyldt','Tallene på kortet står ofte i to linjer, fx 12 cifre øverst og 8 nederst. Systemet sætter dem sammen og tjekker kontrolcifret. Kendes kortet, åbner det i stedet. Kan tallet ikke læses sikkert, får du det at se og kan rette det mod kortet.'],
    ['Skriv telefonnummeret','Skriv kortets telefonnummer, og tryk Gem.']]},
   {img:'grid',alt:'Kartoteket vist som et gitter med lommerne A1, A2 og så videre, optagne lommer orange og ledige grå',steps:[
    ['Kartoteket','Under Simkort, tryk Kartoteket. Du ser alle lommer, hvor mange der er optaget, og den næste ledige.'],
    ['Optaget','En orange lomme har et kort. Tryk på den for at se kortet.'],
    ['Ledig','En grå lomme er ledig. Det næste kort, der tages ud, får den første ledige.']]},
   {img:'slotind',alt:'Boksen Læg simkortet i kartoteket med telefonnummer, ICCID og lommen',steps:[
    ['Kortet tages ud','Tryk Tag ud på kortet (i enhedens vindue eller under Simkort). Det kan kun lade sig gøre, når enheden er på lageret: indlevér enheden først. Systemet giver kortet den første ledige lomme.'],
    ['Læg det i lommen','Boksen viser telefonnummer, ICCID og lommen, fx A2. Læg kortet i den lomme, og tryk OK.']]},
   {img:'slotud',alt:'Boksen Tag simkortet fra kartoteket med telefonnummer, ICCID og lommen',steps:[
    ['Kortet sættes i','Tryk Sæt i enhed (under Simkort, i enhedens vindue eller ved Udlevér), og vælg kortet; lommen står i listen.'],
    ['Tag det fra lommen','Boksen viser, hvilken lomme kortet ligger i. Tag det derfra, sæt det i enheden, og tryk OK. Lommen er nu ledig igen.']]}],
  tips:['Et simkort skal altid have et telefonnummer.','Nyt simkort opretter et kort i hånden: ICCID (18–20 cifre), telefonnummer, og om det sidder i en enhed.','Skriv ikke ICCID af i hånden: tryk Læs simkort fra billede under Simkort, og tag et billede af tallene på kortet.','Lommerne hedder A1, A2 … og fortsætter med B1, når bogstavet er fuldt. Hvor mange lommer der er pr. bogstav, sættes under Opsætning → Lager.','Ligger et kort på lager uden lomme (ældre kort), står det som opgave på Dashboard: giv det en lomme med Ret, eller tryk Giv alle en lomme under Simkort, og læg kortene på plads.','En telefon eller tablet kan ikke være i drift uden simkort: Udlevér kræver et kort, og et kort kan kun tages ud, når enheden er på lageret (Tag ud vises ikke på andre enheder). Sendes enheden retur eller meldes den bortkommet, tager systemet selv kortet ud. Enheder i drift uden kort står som opgave på Dashboard og under Register → Uden simkort.','Overalt, hvor en enhed vises, står kortets nummer som et orange link under enheden. Tryk på det for at se eller rette kortet uden at gå ind på Simkort først.']},
 {id:'rapporter',t:'Rapporter',min:4,intro:'Rapporter til ledelsen, afdelingerne og optælling. Optællingslisten og Låste enheder med bruger kan også bruges digitalt på telefonen.',
  sec:[
   {img:'rap',alt:'Rapporter med listen over rapporter og en rapport',steps:[
    ['Vælg rapport','Fx Statusrapport til ledelsen eller Afdelingsrapport til lederne.'],
    ['Vælg periode','Fx Sidste 30 dage eller Sidste måned.'],
    ['Udskriv eller gem','Udskriv eller gem som PDF, eller Eksportér til Excel.']]},
   {img:'tjek',alt:'Den digitale optællingsliste med scanfelt, feltet Jeg står i, krydser, bemærkninger og knappen Afslut optællingen',steps:[
    ['Scan enheden','Vælg Optællingsliste eller Låste enheder med bruger, og tryk Brug digitalt. Scan med scanneren eller kameraet: listen springer til enheden og sætter kryds. Står den ikke på listen, får du besked.'],
    ['Jeg står i','På optællingslisten: vælg den afdeling, du står i. Står en scannet enhed registreret et andet sted, spørger systemet, om den skal flyttes hertil. Så kommer placeringerne på plads, mens du tæller.'],
    ['Krydset','Sættes af scanningen, eller tryk selv.'],
    ['Skriv en bemærkning','Fx revnet skærm. Alt gemmes af sig selv, og krydser og bemærkninger står også i den udskrevne rapport.'],
    ['Afslut optællingen','Tryk, når du er færdig. Der gemmes en linje med dato, antal fundet og antal ikke fundet (Indlæs lister → Seneste indlæsninger). Enheder, der ikke blev fundet, får knappen Markér som bortkommet og står som opgave på Dashboard. Finder du en af dem bagefter, så sæt kryds: den røde streg og knappen forsvinder, og tallet øverst passer igen. Genåbn optællingen, hvis du vil fortsætte.']]},
   {img:'tjek2',alt:'Den digitale liste over låste enheder: en fundet enhed med knapperne for næste skridt og knappen Afslut runden',steps:[
    ['Næste skridt i rækken','På Låste enheder med bruger får en fundet enhed sit næste skridt lige i rækken: 90 dage Indlevér og Markér som sendt retur, 60 dage Lås op eller Sender retur, 30 dage Beholdes eller Sender retur (30 dage er ikke låst). Beslutningen står så også på Inaktive enheder.'],
    ['Historik','Krydset skriver "Fundet ved runden med låste enheder" i enhedens historik, uden navn. Fjerner du krydset samme dag, forsvinder linjen igen.'],
    ['Afslut runden','Tryk Afslut runden, når du er færdig. Enheder, der ikke blev fundet, får en rød streg og knappen Markér som bortkommet, og de står som opgave på Dashboard, til de er fundet eller afklaret. Genåbn runden, hvis du vil fortsætte.']]}],
  tips:['Låste enheder med bruger viser enhederne på 30, 60 og 90 dage med brugerens navn, etage og afdeling, så du kan finde dem. Enhederne på 30 dage er ikke låst; de er med, så du kan nå dem, før de bliver låst.','Datakvalitet viser fejl og mangler i registeret, fx enheder uden type, uden placering, uden label eller telefoner uden Cura/Admin.','Afdelingsrapporten har kolonnen Cura/Admin, og statusrapporten viser, hvor mange telefoner i drift der er Cura, Admin eller ikke valgt.','Nulstil listen på en digital liste fjerner alle krydser og bemærkninger, så du kan starte forfra. Det kan ikke fortrydes.','Navne er skjult i rapporterne, medmindre du slår Vis navne på brugere til. I afdelingsrapporten og Låste enheder med bruger er de vist.']},
 {id:'soeg',t:'Søg i hele systemet',min:1,intro:'Den hurtigste vej til en enhed eller en person.',
  sec:[
   {img:'qs',alt:'Søgevinduet med resultater for en label',steps:[
    ['Skriv','Klik på forstørrelsesglasset øverst (eller tryk Ctrl+K), og skriv fx en label, et navn, et telefonnummer eller "lager klar".'],
    ['Tryk Enter','Enter gør det, der står ud for det markerede resultat, fx Indlevér eller Udlevér. Pil op og ned vælger.']]}],
  tips:['Små stavefejl gør ikke noget.','Knappen Kamera i søgevinduet scanner en label eller stregkode med kameraet.']},
 {id:'gdpr',t:'GDPR: navne og personoplysninger',min:3,intro:'Registeret indeholder navne og telefonnumre. Her er, hvad systemet gemmer om folk, og hvornår det slettes.',
  sec:[
   {img:'gdpr',alt:'Enhedens vindue efter en indlevering: feltet Bruger er tomt, og historikkens indleveringslinje viser navnet med slettedato',steps:[
    ['Bruger','Mens enheden er i brug, gemmer systemet kun navnet på den, der har den nu. Når enheden indleveres, tømmes feltet, og navnet fjernes fra listerne.'],
    ['Historikken','Indleveringslinjen viser "Bruger: Navn (slettes dato)". På den dato slettes navnet automatisk fra historikken. Serienummer, IMEI og model er om enheden, ikke om personen.']]},
   {img:'gdprpage',alt:'Fanen GDPR med feltet antal dage og knapperne Find personen og Fortegnelse',steps:[
    ['Dage, før navne slettes','På fanen GDPR (på telefonen under Mere). Så mange dage efter indleveringen slettes navnet automatisk fra historikken, og en person uden enhed i så mange dage slettes helt. Standard er 90 dage. Tallet er arbejdspladsens eget valg.'],

/* Version 6.39 (Eddy 01-11-2026, forslag 5): on the web the pictures of Akademi (1,3 MB) are not in the page but in enhedsoverblik-edu.json
   beside it (like the OCR data, 6.31), fetched when Akademi is opened or a few seconds after start, and checked against the SHA-256
   written into the page (meta eo-edu). The delivered single file still has them built in. */
let eduCache=null,eduLoading=null;
const EDU_FILE='enhedsoverblik-edu.json';
function eduEmbedded(){const e=$('#eduImg');if(!e)return null;try{return JSON.parse(e.textContent);}catch(err){return {};}}
async function eduFetch(){
  if(eduCache)return eduCache;
  if(eduLoading)return eduLoading;
  eduLoading=(async()=>{
    try{
      const want=((document.querySelector('meta[name="eo-edu"]')||{}).content||'').toLowerCase();
      if(!/^https?:$/.test(location.protocol)||!/^[0-9a-f]{64}$/.test(want)||!(window.crypto&&crypto.subtle))throw new Error('nodata');
      const r=await fetch(EDU_FILE+'?v='+encodeURIComponent(APP_VER),{cache:'force-cache',credentials:'omit'});if(!r.ok)throw new Error('nodata');
      const buf=await r.arrayBuffer();const hx=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(x=>x.toString(16).padStart(2,'0')).join('');
      if(hx!==want)throw new Error('nodata');
      const o=JSON.parse(new TextDecoder().decode(buf));const out={};
      if(o&&typeof o==='object')Object.keys(o).forEach(k=>{const v=o[k];if(/^[a-z0-9]{1,20}$/.test(k)&&v&&typeof v.d==='string'&&/^[A-Za-z0-9+/=]+$/.test(v.d)&&v.w>0&&v.h>0)out[k]={w:+v.w,h:+v.h,d:v.d};});
      eduCache=out;
    }catch(e){eduCache={};eduFailed=true;}
    finally{eduLoading=null;if(ui.tab==='undervisning')render();}
    return eduCache;
  })();
  return eduLoading;
}
let eduFailed=false;
function eduImg(k){
  if(!eduCache){const e=eduEmbedded();if(e){eduCache=e;}else{eduFetch();return '';}}
  const v=eduCache[k];return v?'data:image/webp;base64,'+v.d:'';
}
if(/^https?:$/.test(location.protocol)&&!document.querySelector('#eduImg'))setTimeout(()=>{if(!eduCache)eduFetch();},6000);
function eduDims(k){eduImg(k);const v=eduCache&&eduCache[k];return v?' width="'+v.w+'" height="'+v.h+'"':'';}

/* Version 6.9 (Eddy 18-10-2026): "Det skal være muligt at pause sin træning under akademi, og komme tilbage og fortsætte, hvor man stoppede".
   Where you are (the open lesson, or the test with its answers) is kept on this pc (localStorage, no names), and the front page offers "Fortsæt". */
const EDU_KEY='enhedsoverblik.akademi';
function eduProg(){const p=lsGet(EDU_KEY);if(!p||typeof p!=='object')return null;const o={};
  if(Number.isInteger(p.les)&&p.les>=0&&p.les<EDU.length)o.les=p.les;
  if(p.quiz&&Number.isInteger(p.quiz.i)&&p.quiz.i>=0&&p.quiz.i<EDU_QUIZ.length&&Array.isArray(p.quiz.ans)&&p.quiz.ans.length===EDU_QUIZ.length)o.quiz={i:p.quiz.i,ans:p.quiz.ans.map(x=>Number.isInteger(x)&&x>=-1&&x<3?x:-1),phase:'q'};
  /* Version 6.10: the lessons finished (Næste pressed) and whether the test is passed, for the status bar. */
  if(Array.isArray(p.done))o.done=[...new Set(p.done.filter(x=>Number.isInteger(x)&&x>=0&&x<EDU.length))].sort((a,b)=>a-b);
  if(p.passed===true)o.passed=true;
  return o.les!=null||o.quiz||(o.done&&o.done.length)||o.passed?o:null;}
function eduSave(ch){const p=eduProg()||{};Object.assign(p,ch);Object.keys(p).forEach(k=>{if(p[k]==null)delete p[k];});lsSet(EDU_KEY,Object.keys(p).length?p:null);}
function quizStart(){ui.quiz={i:0,ans:EDU_QUIZ.map(()=>-1),phase:'q'};eduSave({les:null,quiz:{i:0,ans:ui.quiz.ans}});}
function quizResume(){const p=eduProg();if(!p||!p.quiz)return false;ui.quiz=p.quiz;return true;}
function quizSave(){const z=ui.quiz;if(!z)return;if(z.phase==='q')eduSave({quiz:{i:z.i,ans:z.ans}});else if(quizScore().pass)eduSave({quiz:null,les:null,passed:true,done:EDU.map((L,k)=>k)});else eduSave({quiz:null});}
function eduDone(k){const p=eduProg()||{};const d=new Set(p.done||[]);d.add(k);eduSave({done:[...d].sort((a,b)=>a-b)});}
/* Version 6.10 (Eddy 18-10-2026): "Lav en cool status bjælke under akademi" – one segment per lesson and one for the test; finished segments are green,
   the open one orange; the segments are buttons that open the lesson. Shown on the front page, in every lesson and in the test. */
function eduBar(cur){
  const p=eduProg()||{},done=new Set(p.done||[]),n=done.size+(p.passed?1:0),N=EDU.length+1,pct=Math.round(n/N*100);
  const seg=EDU.map((L,k)=>'<button type="button" class="eseg'+(done.has(k)?' on':'')+(cur===k?' cur':'')+'" data-act="edu-open" data-arg="'+k+'" aria-label="Emne '+(k+1)+': '+L.t+(done.has(k)?', gennemført':'')+(cur===k?', åbent':'')+'" title="'+(k+1)+'. '+L.t+'"></button>').join('')+
    '<button type="button" class="eseg etest'+(p.passed?' on':'')+(cur==='quiz'?' cur':'')+'" data-act="'+(p.quiz?'quiz-resume':'quiz-start')+'" aria-label="Testen'+(p.passed?', bestået':'')+'" title="Testen">'+(p.passed?'✓':'')+'</button>';
  const txt=p.passed?'Hele Akademi gennemført. Testen er bestået.':n?done.size+' af '+EDU.length+' emner gennemført'+(cur==='quiz'?' · testen i gang':'')+'.':cur==='quiz'?'Testen i gang.':'Ikke begyndt endnu.';
  return '<div class="edubar" role="group" aria-label="Din fremgang i Akademi: '+pct+' %"><div class="ebsegs">'+seg+'</div><div class="ebtxt"><span>'+txt+'</span><b class="num">'+pct+' %</b></div></div>';
}
function quizScore(){const z=ui.quiz;const right=EDU_QUIZ.filter((Q,i)=>z.ans[i]===Q.c).length;return {right,total:EDU_QUIZ.length,need:Math.ceil(EDU_QUIZ.length*QUIZ_PASS),pass:right>=Math.ceil(EDU_QUIZ.length*QUIZ_PASS)};}
function quizReview(){
  const z=ui.quiz,wrong=EDU_QUIZ.map((Q,i)=>[Q,i]).filter(([Q,i])=>z.ans[i]!==Q.c);
  if(!wrong.length)return '<div class="notice"><b>Alle svar var rigtige.</b> Der er ikke noget at gennemgå.</div>';
  return '<h2>Gennemgang af dine '+pl(wrong.length,'fejl','fejl')+'</h2>'+ttsButton('rev:0')+'<ol class="qrev">'+wrong.map(([Q,i])=>{const k=EDU.findIndex(L=>L.id===Q.les);
    return '<li><b>'+(i+1)+'. '+Q.q+'</b><span class="qwrong">Dit svar: '+(z.ans[i]>=0?Q.a[z.ans[i]]:'intet svar')+'</span><br><span class="qright">Rigtigt svar: '+Q.a[Q.c]+'</span><span class="qwhy">'+Q.why+(k>=0?' <button class="btn plain small" data-act="edu-open" data-arg="'+k+'">Se emne '+(k+1)+'</button>':'')+'</span></li>';}).join('')+'</ol>';
}
function viewQuiz(){
  const z=ui.quiz,N=EDU_QUIZ.length,back='<button class="btn plain edubackbtn" data-act="edu-open" data-arg="">'+ICON.back+'Akademi</button>';
  if(z.phase==='q'){
    const Q=EDU_QUIZ[z.i],picked=z.ans[z.i];
    return back+eduBar('quiz')+'<div class="quiz"><p class="qprog">Spørgsmål '+(z.i+1)+' af '+N+' · bestået ved mindst '+Math.ceil(N*QUIZ_PASS)+' rigtige</p><div class="qbar"><i style="width:'+Math.round(z.i/N*100)+'%"></i></div>'+
      '<h1>'+Q.q+'</h1>'+ttsButton('quiz:'+z.i)+'<ul class="qopts" role="radiogroup" aria-label="Svar">'+Q.a.map((t,j)=>'<li><label class="qopt"><input type="radio" name="quiz" data-ch="quiz" data-arg="'+j+'"'+(picked===j?' checked':'')+'> <span>'+t+'</span></label></li>').join('')+'</ul>'+
      '<div class="row-actions"><button class="btn primary" data-act="quiz-next"'+(picked<0?' disabled':'')+'>'+(z.i<N-1?'Næste ›':'Se resultatet')+'</button></div></div>';
  }
  const sc=quizScore();
  if(z.phase==='result'&&sc.pass){
    const conf=Array.from({length:28},(_,k)=>'<i class="qconf" style="left:'+(k*3.6)+'%;background:'+['#4A7356','#AD4500','#0071E3','#C20012','#FFD60A'][k%5]+';animation-delay:'+((k*37)%1800)/1000+'s;animation-duration:'+(2.2+(k%5)*.3)+'s" aria-hidden="true"></i>').join('');
    return back+'<div class="quiz"><div class="qwin">'+conf+'<div class="qbig" aria-hidden="true">✓</div><h1>Tillykke, du bestod!</h1><p class="qscore">'+sc.right+' af '+sc.total+' rigtige</p><p>Du kender Enhedsoverblik. Godt gået.</p></div>'+
      '<div class="row-actions"><button class="btn primary" data-act="quiz-review">'+(sc.right===sc.total?'Afslut':'Gennemgå dine fejl')+'</button></div></div>';
  }
  if(z.phase==='result'){
    return back+'<div class="quiz"><div class="qwin qfail"><div class="qbig" aria-hidden="true">!</div><h1>Ikke bestået</h1><p class="qscore">'+sc.right+' af '+sc.total+' rigtige</p><p>Du skal have mindst '+sc.need+' rigtige. Gennemgå dine fejl herunder, og tag så testen igen.</p></div>'+
      quizReview()+'<div class="row-actions"><button class="btn primary" data-act="quiz-start">Tag testen igen</button><button class="btn" data-act="edu-open" data-arg="">Tilbage til Akademi</button></div></div>';
  }
  return back+'<div class="quiz"><p class="qprog">Bestået: '+sc.right+' af '+sc.total+' rigtige</p>'+quizReview()+'<div class="row-actions"><button class="btn primary" data-act="edu-open" data-arg="">Tilbage til Akademi</button><button class="btn" data-act="quiz-start">Tag testen igen</button></div></div>';
}
/* Version 6.15 (Eddy 19-10-2026): "Gør det muligt at få læst træningsmaterialet op". The browser's own speech (speechSynthesis; nothing is sent
   anywhere) reads a lesson (title, introduction, the numbered steps and "Husk") or a question with its three answers. A Danish voice is used when
   the pc or phone has one; otherwise the browser's default voice reads the Danish text. The text is split into sentences-sized parts, because
   Chrome stops a long utterance after about 15 seconds. The button toggles (Læs op / Stop oplæsning); leaving the page stops the reading. */
const TTS=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
let ttsKey='',ttsWarned=false;
if(TTS){try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',()=>speechSynthesis.getVoices());}catch(e){}}
function ttsVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/^da([-_]|$)/i.test(v.lang)&&v.default)||vs.find(v=>/^da([-_]|$)/i.test(v.lang))||null;}catch(e){return null;}}
function ttsClean(t){return String(t).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/→/g,', så ').replace(/\bfx\b/g,'for eksempel').replace(/Ctrl\+K/g,'Control K').replace(/\s+/g,' ').trim();}
function ttsParts(key){
  const m=/^(les|quiz|rev):(\d+)$/.exec(key||'');if(!m)return [];
  const out=[];
  if(m[1]==='les'){const L=EDU[+m[2]];if(!L)return [];out.push(L.t+'.',L.intro);L.sec.forEach(s=>s.steps.forEach((st,k)=>out.push((k+1)+'. '+st[0]+'. '+st[1])));if(L.tips.length){out.push('Husk.');L.tips.forEach(t=>out.push(t));}}
  else if(m[1]==='quiz'){const Q=EDU_QUIZ[+m[2]];if(!Q)return [];out.push('Spørgsmål '+(+m[2]+1)+'. '+Q.q);Q.a.forEach((a,k)=>out.push('Svar '+(k+1)+': '+a));}
  else{const z=ui.quiz;if(!z)return [];EDU_QUIZ.forEach((Q,i)=>{if(z.ans[i]===Q.c)return;out.push('Spørgsmål '+(i+1)+'. '+Q.q,'Dit svar: '+(z.ans[i]>=0?Q.a[z.ans[i]]:'intet svar')+'.','Rigtigt svar: '+Q.a[Q.c]+'.',Q.why);});}
  return out.map(ttsClean).flatMap(t=>t.replace(/([a-zA-ZæøåÆØÅ)"][.!?])\s+(?=[A-ZÆØÅ0-9"„(])/g,'$1\n').split('\n')).map(t=>t.trim()).filter(Boolean);
}
/* Version 6.16 (Eddy 19-10-2026): the button is blue with white text in both states and sits under the heading in the lessons as in the test. */
function ttsButton(key){if(!TTS)return '';const on=ttsKey===key;return '<button class="btn small primary ttsbtn" data-act="edu-read" data-arg="'+key+'" aria-pressed="'+(on?'true':'false')+'">'+(on?ICON.stop+'Stop oplæsning':ICON.speak+'Læs op')+'</button>';}
function ttsPaint(){document.querySelectorAll('.ttsbtn').forEach(b=>{const on=ttsKey===b.dataset.arg;b.setAttribute('aria-pressed',on?'true':'false');b.innerHTML=on?ICON.stop+'Stop oplæsning':ICON.speak+'Læs op';});}
function ttsStop(){if(!TTS)return;ttsKey='';try{speechSynthesis.cancel();}catch(e){}ttsPaint();}
function ttsStart(key){
  if(!TTS)return;if(ttsKey===key){ttsStop();return;}
  ttsStop();const parts=ttsParts(key);if(!parts.length)return;
  const v=ttsVoice();if(!v&&!ttsWarned){ttsWarned=true;toast('Der er ingen dansk stemme på denne enhed, så oplæsningen kan lyde udenlandsk.');}
  ttsKey=key;const my=key;
  parts.forEach((p,k)=>{const u=new SpeechSynthesisUtterance(p);u.lang='da-DK';if(v)u.voice=v;u.rate=.95;if(k===parts.length-1){u.onend=()=>{if(ttsKey===my)ttsStop();};}u.onerror=()=>{if(ttsKey===my)ttsStop();};try{speechSynthesis.speak(u);}catch(e){}});
  ttsPaint();
}
if(TTS)document.addEventListener('visibilitychange',()=>{if(document.hidden&&ttsKey)ttsStop();});
function eduLesson(i,printing){
  const L=EDU[i];let n=0;
  return '<article class="edul">'+(printing?'<h2 class="edu-pt">'+(i+1)+'. '+L.t+'</h2>':'<h1>'+L.t+'</h1>'+ttsButton('les:'+i))+'<p class="edu-intro">'+L.intro+' <span class="edu-min">Ca. '+L.min+' min.</span></p>'+
    L.sec.map(s=>{const src=eduImg(s.img);return '<section class="edus">'+(!src&&!eduCache&&!printing?'<figure class="edufig eduwait"><p class="muted" aria-live="polite">Henter billedet…</p></figure>':!src&&eduFailed&&!printing?'<figure class="edufig eduwait"><p class="muted">Billedet kunne ikke hentes. Tjek forbindelsen, og åbn emnet igen.</p></figure>':'')+(src?'<figure class="edufig">'+(printing?'':'<button class="eduzbtn" data-act="edu-zoom" data-arg="'+s.img+'" aria-label="Vis billedet i fuld størrelse: '+esc(s.alt)+'">')+'<img src="'+src+'"'+eduDims(s.img)+' alt="'+(printing?esc(s.alt):'')+'"'+(printing?'':' loading="lazy" decoding="async"')+'>'+(printing?'':'</button><figcaption class="eduhint">Tryk på billedet for at se det større.</figcaption>')+'</figure>':'')+
      '<ol class="edusteps">'+s.steps.map((st,j)=>'<li><span class="edunum" aria-hidden="true">'+(j+1)+'</span><div><b>'+st[0]+'</b><span>'+st[1]+'</span></div></li>').join('')+'</ol></section>';}).join('')+
    (L.tips.length?'<div class="notice edutips"><b>Husk</b><ul>'+L.tips.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>':'')+'</article>';
}
/* 6.35: the Akademi front page (not a lesson or the test) gets "‹ Mere" on a phone, like the other pages under Mere. */
function eduFront(){const i=ui.edu;return !(i==='quiz'&&ui.quiz)&&(i==null||i<0||i>=EDU.length);}
function viewUndervisning(){
  const i=ui.edu;
  if(i==='quiz'&&ui.quiz)return viewQuiz();
  if(i==null||i<0||i>=EDU.length){
    const row=(k,title,sub,ic)=>'<li><button class="mrow" data-act="edu-open" data-arg="'+k+'"><span class="ic orange edunr" aria-hidden="true">'+ic+'</span><span>'+title+(sub?'<small>'+sub+'</small>':'')+'</span>'+ICON.chev+'</button></li>';
    const total=EDU.reduce((a,L)=>a+L.min,0);
    return '<div class="lead"><h1>Akademi</h1><p>Lær systemet trin for trin. Hvert emne tager et par minutter, og billederne viser præcis, hvor du skal klikke. Alt i alt ca. '+total+' minutter. Du kan holde pause når som helst: Akademi husker på denne pc, hvor du er, og også dine svar i testen.'+(TTS?' Hvert emne og hvert spørgsmål kan læses højt: tryk Læs op.':'')+'</p></div>'+eduBar(-1)+
      (()=>{const p=eduProg();if(!p||(p.les==null&&!p.quiz))return '';const done=p.quiz?p.quiz.ans.filter(x=>x>=0).length:0;
        return '<div class="notice eduresume"><p><b>Du var i gang.</b> '+(p.quiz?'Testen, spørgsmål '+(p.quiz.i+1)+' af '+EDU_QUIZ.length+(done?' ('+done+' besvaret)':'')+'.':'Emne '+(p.les+1)+': '+EDU[p.les].t+'.')+' Fortsæt, hvor du stoppede, eller start forfra.</p><div class="row-actions">'+(p.quiz?'<button class="btn primary" data-act="quiz-resume">Fortsæt testen</button>':'<button class="btn primary" data-act="edu-open" data-arg="'+p.les+'">Fortsæt emne '+(p.les+1)+'</button>')+'</div></div>';})()+
      '<div class="row-actions" style="margin-bottom:1.6rem"><button class="btn'+((p=>p&&(p.les!=null||p.quiz))(eduProg())?'':' primary')+'" data-act="edu-restart">Start forfra</button><button class="btn" data-act="edu-print">Udskriv det hele (PDF)</button></div>'+
      '<section><h2>Hvad skal du gøre?</h2><ul class="mlist">'+EDU_HELP.map(h=>{const k=EDU.findIndex(L=>L.id===h[1]);return row(k,h[0],'Se emne '+(k+1)+': '+EDU[k].t,ICON.edu);}).join('')+'</ul></section>'+
      '<section><h2>Alle emner</h2><ul class="mlist edulist">'+EDU.map((L,k)=>row(k,L.t,L.intro+' Ca. '+L.min+' min.',String(k+1))).join('')+'</ul></section>'+
      '<section><h2>Test dig selv</h2><ul class="mlist"><li><button class="mrow" data-act="quiz-start"><span class="ic green" aria-hidden="true">✓</span><span>Tag testen<small>'+EDU_QUIZ.length+' spørgsmål om det, du har lært. Bestået ved mindst '+Math.round(QUIZ_PASS*100)+' % rigtige. Ca. 6 min.</small></span>'+ICON.chev+'</button></li></ul></section>';
  }
  return '<button class="btn plain edubackbtn" data-act="edu-open" data-arg="">'+ICON.back+'Alle emner</button>'+
    eduBar(i)+'<p class="edu-count"><span>Emne '+(i+1)+' af '+EDU.length+'</span></p>'+eduLesson(i)+
    '<div class="row-actions edunav">'+(i>0?'<button class="btn" data-act="edu-open" data-arg="'+(i-1)+'">‹ Forrige: '+EDU[i-1].t+'</button>':'')+
    (i<EDU.length-1?'<button class="btn primary" data-act="edu-next" data-arg="'+i+'">Næste: '+EDU[i+1].t+' ›</button>':'<button class="btn primary" data-act="edu-finish" data-arg="'+i+'">Færdig. Tag testen ›</button>')+'</div>';
}
function printEdu(){
  printArea('<style>@page{size:A4;margin:14mm 14mm 16mm}</style><div class="edu-print"><h1>Akademi: Enhedsoverblik</h1>'+EDU.map((L,i)=>eduLesson(i,true)).join('')+'</div>');
}
function eduZoom(k){
  const src=eduImg(k);if(!src)return;
  let alt='';EDU.forEach(L=>L.sec.forEach(s=>{if(s.img===k)alt=s.alt;}));

/* ---------- Quick search ---------- */
/* One search across the whole tool: devices, people, places and actions.
   Short words act as filters ("60", "lager klar", "fratrådt", "tablet 3. sal"),
   the rest is matched against the fields, tolerant of case, hyphens, æøå and small typos. */
const qs={q:'',sel:0,items:[]};
const fold=s=>String(s==null?'':s).toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9.]+/g,' ').trim();
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];let best=i;
    for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur.push(v);if(v<best)best=v;}
    if(best>max)return max+1;prev=cur;}
  return prev[b.length];
}
/* How well one search word fits a text: 3 exact word or code, 2 start of a word, 1 inside, 0.5 near miss. */
function wordScore(tok,text){
  const f=fold(text);if(!f||!tok)return 0;
  if(skey(text)&&skey(text)===skey(tok))return 3;
  const words=f.split(' ');
  if(words.includes(tok))return 3;
  if(words.some(w=>w.startsWith(tok)))return 2;
  if(f.replace(/ /g,'').includes(tok.replace(/ /g,''))||(skey(tok).length>=3&&skey(text).includes(skey(tok))))return 1;
  if(tok.length>=4&&!/^\d+$/.test(tok)){const m=tok.length>=7?2:1;if(words.some(w=>w.length>=3&&lev(tok,w,m)<=m))return .5;}
  return 0;
}

function qsFilters(q){
  const im=inactMap(),lv=leaverSet(),valid=validPlaces(),f=[],names=[];let rest=' '+q+' ';
  const add=(name,fn)=>{f.push(fn);names.push(name);};
  const take=(re,name,fn)=>{const m=rest.match(re);if(m){rest=rest.replace(re,' ');add(typeof name==='function'?name(m):name,typeof fn==='function'&&fn.length===2?d=>fn(d,m):fn);}};
  /* Places first, so "afd 30" is a department and not the 30-day list. */
  take(/ afd\.? ?(\d+) /,m=>'afd. '+m[1],(d,m)=>{const ids=new Set(allDepts().filter(x=>fold(x.name).replace(/[ .]/g,'')==='afd'+m[1]).map(x=>x.id));return ids.has(d.deptId);});
  take(/ (\d)\.? ?sal /,m=>m[1]+'. sal',(d,m)=>{const fl=state.floors.find(x=>fold(x.name).replace(/[ .]/g,'')===m[1]+'sal');return !!fl&&fl.depts.some(x=>x.id===d.deptId);});
  take(/ stuen /,'stuen',d=>{const fl=state.floors.find(x=>fold(x.name)==='stuen');return !!fl&&fl.depts.some(x=>x.id===d.deptId);});
  take(/ mpo /,'MPO',d=>allDepts().some(x=>x.id===d.deptId&&fold(x.name)==='mpo'));
  take(/ ikke klar /,'ikke klar',d=>inStock(d)&&stockState(d)==='ikke');
  take(/ uden placering /,'uden placering',d=>ACTIVE.has(d.status)&&!valid.has(d.deptId));
  take(/ ikke paa listerne /,'ikke på listerne',d=>isMissing(d,im));
  take(/ (90|60|30)( dage)? /,m=>m[1]+' dage',(d,m)=>{const r=im.get(d.id);return !!r&&r.cat===+m[1];});
  take(/ (inaktiv|inaktive) /,'inaktive',d=>im.has(d.id));
  take(/ lager /,'lager',inStock);
  take(/ klar /,'klar',d=>inStock(d)&&stockState(d)==='klar'&&!mustReturn(d));
  take(/ (fratraadt|fratraadte) /,'fratrådt',d=>!!d.lastUser&&lv.has(nkey(d.lastUser)));
  take(/ (vikar|vikartelefon|vikartelefoner|vikartablet|vikarenhed|vikarenheder) /,'vikartelefon',d=>!!d.shared);

  return {f,names,rest:rest.trim().split(' ').filter(Boolean)};
}
function hl(text,toks){

  toks.forEach(tk=>{const i=low.indexOf(tk);if(i>=0&&tk.length>=2&&(!best||tk.length>best[1]))best=[i,tk.length];});

/* Reads Code 128 barcodes (the labels and most IMEI and serial barcodes) with

const cam={stream:null,timer:null,hits:Object.create(null),det:null,busy:false,gen:0,frame:0,field:null};

/* 6.45 (Eddy 06-11-2026: "Når man står i feltet serienummer og scanner serienummeret, så skal nummeret ligges ind på linjen"):
   the Scan button by Serienummer in the device window reads a barcode with the camera and puts it in the field; Luk goes back to the device.
   A hand scanner types into the field by itself; a reading from the paired phone goes into the field when the cursor stands in it. */
function serialInto(id,text){
  const d=devById(id);if(!d)return;
  const v=clean(text).toUpperCase().replace(/\s+/g,'');if(!v)return;
  d.serial=v;markDirty();
  const dup=state.devices.some(x=>x!==d&&norm(x.serial)===norm(v));
  openDevice(id);if(ui.tab==='register')refreshReg();
  const el=$('#dlg [data-in="dev"][data-k="serial"]');if(el)el.focus({preventScroll:true});
  toast('Serienummeret '+v+' er sat ind.'+(dup?' Det findes allerede på en anden enhed i registeret.':''));
}
function camFound(text){
  if(cam.field&&!PH){const f=cam.field;cam.field=null;phBeep(true);try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}camStop();serialInto(f,text);return;}
  if(PH){phoneSend(text);return;}
  if(ui.tab==='tjek'){phBeep(true);try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}dlgCleanup();$('#dlg').close();toast('Læst: '+text);setTimeout(()=>tjekScan(text),0);return;}

  phBeep(true);try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}
  dlgCleanup();$('#dlg').close();
  const m=findByScan(text),code=simDigits(text);

  ui.tab='lager';ui.scan=text;render();

/* A code counts once per video frame and is accepted when two different frames agree. */
function camHit(text,frame){
  text=clean(text);if(!text)return;
  const h=cam.hits[text]||(cam.hits[text]={n:0,f:-1});
  if(h.f===frame)return;h.f=frame;h.n++;

function camTick(video,cv){

  cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(video,0,0,w,h);
  const px=cx.getImageData(0,0,w,h).data,fr=++cam.frame,g=cam.gen;

/* ---------- Scan med telefon (version 5.53) ----------
   Eddy's wish 10-10-2026: a phone with a camera is paired with the tool and
   used as a scanner. The pc shows a QR code with a one-off token; the phone
   opens the tool's web address with that token and becomes a scanner page.
   Each scan is sent through the database (rpc scan_push, only allowed for a
   token that has not expired); the pc fetches the scans every 1.5 seconds,
   treats them as if they had been scanned at the pc, and deletes them.
   Only the scanned text goes through the database: no names, no register. */
const APP_KEY='enhedsoverblik.app';
const pair={token:'',until:0,timer:null,n:0,busy:false,seen:false};
function appUrl(){const s=lsGet(APP_KEY);if(typeof s==='string'&&/^https?:\/\//i.test(s))return s.replace(/#.*$/,'');return /^https?:$/.test(location.protocol)?location.origin+location.pathname:'';}

function pairLink(){return appUrl()+'#scan='+pair.token+'&u='+encodeURIComponent(db.cfg.url)+'&k='+encodeURIComponent(db.cfg.key);}
function pairStop(remote){
  if(pair.timer)clearInterval(pair.timer);pair.timer=null;
  const t=pair.token;pair.token='';pair.until=0;pair.n=0;pair.seen=false;
  if(remote&&t&&dbLoggedIn())dbFetch('/rest/v1/scan_pairs?token=eq.'+encodeURIComponent(t),{method:'DELETE',headers:{'Prefer':'return=minimal'}}).catch(()=>{});
}
async function pairStart(){
  await dbEnsure();
  const t=pairToken(),r=await dbFetch('/rest/v1/scan_pairs',{method:'POST',body:{token:t},headers:{'Prefer':'return=minimal'}});
  if(!r.ok)throw new Error(r.status===404?'Databasen mangler tabellerne til telefonen. Kør SQL\'en under Opsætning → Database igen.':'Databasen svarede ikke ('+r.status+').');
  pair.token=t;pair.until=Date.now()+8*3600*1000;pair.n=0;pair.seen=false;
  if(pair.timer)clearInterval(pair.timer);
  pair.timer=setInterval(pairPoll,1500);
}
async function pairPoll(){
  if(pair.busy)return;
  if(!pairOn()||!dbLoggedIn()){pairStop(false);refreshPairUi();return;}
  pair.busy=true;const t=pair.token;
  try{
    await dbEnsure();
    const r=await dbFetch('/rest/v1/scans?token=eq.'+encodeURIComponent(t)+'&select=id,value&order=id.asc');
    if(t!==pair.token||!r.ok||!Array.isArray(r.json)||!r.json.length)return;
    const max=Math.max.apply(null,r.json.map(x=>+x.id||0));
    await dbFetch('/rest/v1/scans?token=eq.'+encodeURIComponent(t)+'&id=lte.'+max,{method:'DELETE',headers:{'Prefer':'return=minimal'}});
    if(t!==pair.token)return;
    r.json.forEach(x=>phoneIn(clean(String(x.value||'')).slice(0,64)));
  }catch(e){}finally{pair.busy=false;}
}
/* A scan from the phone: as if it was scanned at the pc. */

  if(dl.open&&!dl.classList.contains('pairdlg')){toast('Fra telefonen: '+v+'. Gør vinduet færdigt, eller luk det, og scan igen.');return;}

function pairStatusText(){

  const left=Math.max(0,Math.round((pair.until-Date.now())/60000)),h=Math.floor(left/60),m=left%60;
  return (pair.seen?'Telefonen er forbundet. '+pl(pair.n,'scanning','scanninger')+' modtaget.':'Venter på telefonen…')+' Forbindelsen udløber om '+(h?h+' t ':'')+m+' min.';
}
function refreshPairUi(){
  const s=$('#pairStat');if(s)s.textContent=pairStatusText();
  const b=$('#main [data-act="phone-open"]');if(b)b.textContent=pairOn()?'Telefon forbundet':'Scan med telefon';
}
function openPair(){

/* ---------- Database (version 5.0) ----------
   Eddy's decision 09-10-2026: the register lives in a database in the cloud.
   The database is a Supabase project (Postgres with a REST interface) that
   Eddy sets up once with the SQL shown under Opsætning.
   - The tool talks only to that one address (the Content-Security-Policy
     allows nothing else), and only after a login with e-mail and password.
   - Every change is saved to the database a moment later (autosave).
   - Without a connection the change is kept in the browser (IndexedDB) as
     an outbox; when the connection is back it is sent, and when the database
     has confirmed it, the local copy is deleted. Besides that outbox the
     browser keeps only the address, the key, the login e-mail and the session.

/* IndexedDB: one store with one record, the outbox. */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('enhedsoverblik',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('outbox'))d.createObjectStore('outbox');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}

   at most SNAP_MAX and never older than SNAP_DAYS days (names). Opsætning → Database lists them with "Gendan", which loads the copy and saves

  perform pg_advisory_xact_lock(hashtext('enhedsoverblik_roller'));

end $$;

  if p_role not in ('admin', 'medarbejder') then raise exception 'ukendt rolle' using errcode = '22023'; end if;

/* ---------- Users and invitations (version 6.29) ---------- */
/* Version 6.29 (Eddy 20-10-2026): "Det skal være muligt at invitere nye brugere til systemet, så deres e-mail bliver lagt i Supabase,
   og der sendes en lækker designet invitation … Linket i invitationen fører til login siden. Invitationens delen skal være i opsætning.
   Man skal også kunne se på en smart liste, hvem der har bruger adgang til systemet."
   How it works without a secret key in the page: the e-mail goes into the table `invites` (the allow-list), then the database is asked
   to create the user and send the "Confirm signup" e-mail (POST /auth/v1/otp with create_user:true). A trigger on auth.users refuses
   every e-mail that is not in `invites`, so "Allow new users to sign up" can be on without anyone else getting in. The e-mail's link
   ({{ .ConfirmationURL }}) confirms the address and sends the person to the tool's web address = the login page. The list is the view
   `app_users` (e-mail, created, last login) joined with `invites` (who invited, when); an invitation that has not been used can be
   withdrawn (`revoke_invite`, deletes the user only if the person never logged in). A user who has logged in is removed with
   "Fjern adgang" (`remove_user`, 6.31). */
const inv={busy:false,list:null,invites:null,err:'',at:0,loading:false,roles:null};
/* Version 6.31 (forslag 24–25, Eddy 21-10-2026): roles. app_roles in the database says who is "admin"; everybody else is
   "medarbejder". Only an administrator can invite, withdraw an invitation, remove a user, change roles, delete a device,
   restore a safety copy, delete a person (GDPR) and clear all data. Before the SQL from 6.31 is run (no table), and as long as
   nobody is administrator yet, everybody may do everything as before; then "Gør mig til administrator" is offered.
   Without a database (local file, example data) there are no roles. The database enforces invitations, roles and removal;
   the register itself is one row, so deleting a device is only stopped in the tool (and can be undone from a safety copy). */
const role={state:'',me:'',adminExists:false,g:-1};
/* 6.35: with a database set up but nobody logged in (session expired, outbox loaded before login) there is no role: not admin. */
function roleNow(){if(!dbOn())return 'local';if(!dbLoggedIn())return 'unknown';return role.state||'unknown';}
function isAdmin(){const r=roleNow();return r==='admin'||r==='local'||r==='legacy'||r==='noadmin';}
function adminOnly(what){if(isAdmin())return true;if(dbOn()&&!dbLoggedIn()){toast('Log ind på databasen først. Kun en administrator kan '+what+'.');return false;}toast('Kun en administrator kan '+what+'. Spørg en administrator under Opsætning → Database → Brugere.');return false;}
async function roleLoad(){
  if(!dbLoggedIn())return;const g=db.gen;
  try{const r=await dbFetch('/rest/v1/app_roles?select=email,role');if(g!==db.gen)return;
    const me=dbWho().toLowerCase();
    if(!r.ok||!Array.isArray(r.json)){role.state=r.status===404||(r.json&&/relation|schema cache|PGRST2/i.test(String(r.json.code||'')+String(r.json.message||'')))?'legacy':'unknown';inv.roles=null;}
    else{const rows=r.json.filter(isObj).map(x=>({email:String(x.email||'').toLowerCase().slice(0,254),role:x.role==='admin'?'admin':'medarbejder'}));inv.roles=rows;
      role.adminExists=rows.some(x=>x.role==='admin');role.state=!role.adminExists?'noadmin':rows.some(x=>x.email===me&&x.role==='admin')?'admin':'medarbejder';}
    role.me=me;role.g=g;
  }catch(e){if(g===db.gen&&!role.state)role.state='unknown';}
  if(g===db.gen)render();
}
function roleReset(){role.state='';role.me='';role.adminExists=false;role.g=-1;inv.roles=null;kopiDay='';sqlv.n=-1;}
/* Version 6.39 (Eddy 01-11-2026, forslag 4): Driftstjek says whether the newest SQL has been run. db_version() (6.39) answers with the
   version; without it, user_ok() (6.35) means the SQL from 6.35 is in place; without both the setup is older. */
const DB_SQL_NEED=635;const sqlv={n:-1};
async function sqlVerLoad(){
  if(!dbLoggedIn())return;const g=db.gen;
  try{const r=await dbFetch('/rest/v1/rpc/db_version',{method:'POST',body:{}});if(g!==db.gen)return;
    if(r.ok&&typeof r.json==='number'){sqlv.n=r.json;return;}
    if(r.status===404||(r.json&&/PGRST202|function/i.test(String(r.json.code||'')+String(r.json.message||'')))){const u=await dbFetch('/rest/v1/rpc/user_ok',{method:'POST',body:{}});if(g!==db.gen)return;sqlv.n=u.ok&&typeof u.json==='boolean'?635:0;return;}
    sqlv.n=-1;
  }catch(e){if(g===db.gen)sqlv.n=-1;}
}
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function usersReset(){inv.list=null;inv.invites=null;inv.err='';inv.at=0;inv.loading=false;inv.busy=false;roleReset();}
async function usersLoad(force){
  if(!dbLoggedIn()||inv.loading)return;
  if(!force&&inv.list&&Date.now()-inv.at<30000)return;
  const g=db.gen;inv.loading=true;
  try{
    const [u,i]=await Promise.all([dbFetch('/rest/v1/app_users?select=email,created_at,last_sign_in_at&order=email.asc'),dbFetch('/rest/v1/invites?select=email,invited_by,invited_at&order=invited_at.desc'),roleLoad(),sqlVerLoad()]);
    if(g!==db.gen)return;
    if(!u.ok||!Array.isArray(u.json)){inv.err=u.status===401||u.status===403?'Listen kunne ikke hentes (ikke adgang).':'Listen kræver den nye opsætning af databasen (visningen app_users). Kør SQL\'en under "Opsætning af databasen" igen i Supabase.';inv.list=null;}
    else{inv.err='';inv.list=u.json.filter(isObj).map(x=>({email:String(x.email||'').toLowerCase().slice(0,254),created:x.created_at?localISO(String(x.created_at)):'',last:x.last_sign_in_at?localISO(String(x.last_sign_in_at)):''}));
      inv.invites=i.ok&&Array.isArray(i.json)?i.json.filter(isObj).map(x=>({email:String(x.email||'').toLowerCase().slice(0,254),by:String(x.invited_by||'').slice(0,254),at:x.invited_at?localISO(String(x.invited_at)):''})):[];}
    inv.at=Date.now();
  }catch(e){if(g!==db.gen)return;inv.err=e.message||'Listen kunne ikke hentes.';}
  finally{if(g===db.gen)inv.loading=false;}
  if(ui.tab==='opsaetning'&&!$('#dlg').open)render();
}

    /* 6.31: who invited (or created in Supabase) stands under the e-mail, so the table has room for Rolle. */
    const by=iv?'Inviteret af '+esc(iv.by||'')+(iv.at?' <span class="nowrap">'+fmtDate(iv.at)+'</span>':''):(u.created?'Oprettet i Supabase <span class="nowrap">'+fmtDate(u.created)+'</span>':'');

  return '<div class="users" style="margin-top:1.2rem"><h3 style="margin:0 0 .4rem;font-size:1rem">Brugere</h3>'+

    (roleNow()==='noadmin'?'<div class="notice warn"><p><b>Ingen er administrator endnu.</b> Indtil nogen er det, kan alle invitere og slette. Er det dig, der passer systemet, så tryk her. <button class="btn small primary" data-act="role-claim">Gør mig til administrator</button></p></div>':'')+
    (roleNow()==='legacy'?'<p class="warnline">Roller (administrator og medarbejder) kræver den nye opsætning af databasen fra 6.31. Kør SQL\'en under "Opsætning af databasen" igen i Supabase.</p>':'')+
    (roleNow()==='medarbejder'?'<p class="muted">Du er medarbejder. Kun en administrator kan invitere og fjerne brugere.</p>':'<div class="formgrid"><label class="field">Ny brugers e-mail<input type="email" autocapitalize="off" spellcheck="false" autocomplete="off" data-in="inv-email" placeholder="navn@eksempel.dk"></label></div>')+
